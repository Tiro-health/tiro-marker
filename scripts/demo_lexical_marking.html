<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lexical · Sentence Boundary Editor</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    "Inter",
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: #0c0c14;
                color: #d0d0d8;
                min-height: 100vh;
                padding: 24px;
            }

            /* ── Header ── */
            .header {
                max-width: 860px;
                margin: 0 auto 20px;
            }
            .header h1 {
                font-size: 22px;
                font-weight: 600;
                color: #f0f0f5;
                margin-bottom: 4px;
            }
            .header .badges {
                display: flex;
                gap: 8px;
                margin-bottom: 6px;
            }
            .badge {
                font-size: 10px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                padding: 3px 8px;
                border-radius: 4px;
            }
            .badge-lexical {
                background: #6366f120;
                color: #818cf8;
                border: 1px solid #6366f140;
            }
            .badge-sentencex {
                background: #22c55e20;
                color: #4ade80;
                border: 1px solid #22c55e40;
            }
            .header p {
                font-size: 13px;
                color: #707088;
                line-height: 1.5;
            }

            /* ── Toolbar ── */
            .toolbar {
                max-width: 860px;
                margin: 0 auto 12px;
                display: flex;
                gap: 10px;
                align-items: center;
                flex-wrap: wrap;
            }
            .toolbar label {
                font-size: 12px;
                color: #707088;
            }
            .toolbar input {
                background: #1a1a28;
                border: 1px solid #2a2a3a;
                color: #d0d0d8;
                border-radius: 6px;
                padding: 5px 10px;
                font-size: 12px;
            }
            .toolbar button {
                background: #2a2a3a;
                border: 1px solid #3a3a4a;
                color: #d0d0d8;
                border-radius: 6px;
                padding: 5px 14px;
                font-size: 12px;
                cursor: pointer;
                transition: background 0.15s;
            }
            .toolbar button:hover {
                background: #3a3a4a;
            }
            .toolbar button.active {
                background: #6366f1;
                border-color: #6366f1;
                color: #fff;
            }
            .status {
                font-size: 11px;
                color: #505068;
                margin-left: auto;
            }

            /* ── Editor ── */
            .editor-wrap {
                position: relative;
                max-width: 860px;
                margin: 0 auto 20px;
                background: #14141e;
                border: 1px solid #2a2a3a;
                border-radius: 10px;
                overflow: hidden;
            }
            #highlight-layer {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                pointer-events: none;
                z-index: 0;
            }
            .hl-rect {
                position: absolute;
                pointer-events: none;
                transition: opacity 0.15s;
            }

            /* Lexical root element styles */
            #editor {
                position: relative;
                z-index: 1;
                min-height: 260px;
                padding: 20px 24px;
                font-size: 16px;
                line-height: 1.75;
                background: transparent;
                outline: none;
                color: #e8e8f0;
                caret-color: #7c7cff;
            }
            /* Lexical theme classes */
            #editor p.editor-paragraph {
                margin: 0 0 4px 0;
            }
            #editor:empty::before {
                content: "Start typing here…";
                color: #44445a;
            }

            /* ── Panel ── */
            .panel {
                max-width: 860px;
                margin: 0 auto;
                background: #14141e;
                border: 1px solid #2a2a3a;
                border-radius: 10px;
                overflow: hidden;
            }
            .panel-header {
                padding: 14px 20px;
                border-bottom: 1px solid #2a2a3a;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .panel-header h2 {
                font-size: 14px;
                font-weight: 600;
                color: #a0a0b8;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .panel-header .count {
                font-size: 12px;
                color: #606078;
                background: #1e1e2e;
                padding: 2px 10px;
                border-radius: 12px;
            }
            #sentence-list {
                max-height: 340px;
                overflow-y: auto;
            }
            .s-row {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                padding: 10px 20px;
                border-bottom: 1px solid #1a1a28;
                font-size: 13px;
                transition: background 0.1s;
                cursor: default;
            }
            .s-row:hover {
                background: #1a1a28;
            }
            .s-row:last-child {
                border-bottom: none;
            }
            .s-color {
                flex-shrink: 0;
                width: 14px;
                height: 14px;
                border-radius: 4px;
                margin-top: 2px;
            }
            .s-id {
                flex-shrink: 0;
                width: 50px;
                font-family: "SF Mono", "Fira Code", monospace;
                font-size: 11px;
                color: #606078;
                margin-top: 1px;
            }
            .s-text {
                flex: 1;
                color: #b8b8cc;
                word-break: break-word;
            }
            .s-offsets {
                flex-shrink: 0;
                font-family: "SF Mono", "Fira Code", monospace;
                font-size: 10px;
                color: #404058;
                margin-top: 2px;
            }

            /* ── Debug ── */
            .debug-panel {
                max-width: 860px;
                margin: 16px auto 0;
                background: #14141e;
                border: 1px solid #2a2a3a;
                border-radius: 10px;
                overflow: hidden;
            }
            .debug-header {
                padding: 10px 20px;
                border-bottom: 1px solid #2a2a3a;
                font-size: 12px;
                font-weight: 600;
                color: #606078;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                cursor: pointer;
                user-select: none;
                display: flex;
                justify-content: space-between;
            }
            .debug-content {
                padding: 12px 20px;
                font-family: "SF Mono", "Fira Code", monospace;
                font-size: 11px;
                color: #707088;
                white-space: pre-wrap;
                max-height: 200px;
                overflow-y: auto;
                display: none;
            }
            .debug-content.open {
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="badges">
                <span class="badge badge-lexical">Lexical Editor</span>
                <span class="badge badge-sentencex">sentencex</span>
            </div>
            <h1>Sentence Boundary Editor</h1>
            <p>
                Powered by Lexical's editor state model and sentencex for
                abbreviation-aware segmentation. Type freely — stable IDs keep
                colors anchored when you split or merge sentences.
            </p>
        </div>

        <div class="toolbar">
            <label>Lang:</label>
            <input id="lang" type="text" value="en" style="width: 40px" />
            <button id="btn-highlights" class="active">Highlights On</button>
            <span class="status" id="status">Loading…</span>
        </div>

        <div class="editor-wrap">
            <div id="highlight-layer"></div>
            <div id="editor" contenteditable="true"></div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>Detected Sentences</h2>
                <span class="count" id="s-count">0 sentences</span>
            </div>
            <div id="sentence-list"></div>
        </div>

        <div class="debug-panel">
            <div class="debug-header" id="debug-toggle">
                Lexical EditorState <span id="debug-arrow">▸</span>
            </div>
            <div class="debug-content" id="debug-content"></div>
        </div>

        <!-- ═══════════════════════════════════════════════════════════
     ES Module imports: Lexical from esm.sh, sentencex from jsdelivr.
     These work when served over HTTP (localhost or any server).
     They will NOT load inside Claude's artifact sandbox.
     ═══════════════════════════════════════════════════════════ -->
        <script type="importmap">
            {
                "imports": {
                    "lexical": "https://esm.sh/lexical@0.21.0",
                    "@lexical/plain-text": "https://esm.sh/@lexical/plain-text@0.21.0",
                    "@lexical/history": "https://esm.sh/@lexical/history@0.21.0",
                    "sentencex": "https://cdn.jsdelivr.net/npm/sentencex@0.1.0/dist/index.js"
                }
            }
        </script>

        <script type="module">
            // ═══════════════════════════════════════════════════════════════
            // 1. LEXICAL EDITOR SETUP
            // ═══════════════════════════════════════════════════════════════
            import {
                createEditor,
                $getRoot,
                $createParagraphNode,
                $createTextNode,
            } from "lexical";
            import { registerPlainText } from "@lexical/plain-text";
            import {
                registerHistory,
                createEmptyHistoryState,
            } from "@lexical/history";
            import segment from "sentencex";

            const editorConfig = {
                namespace: "SentenceEditor",
                theme: {
                    paragraph: "editor-paragraph",
                },
                onError: (error) => console.error("[Lexical]", error),
            };

            const editor = createEditor(editorConfig);
            const editorEl = document.getElementById("editor");
            editor.setRootElement(editorEl);

            // Register plain text editing behavior (keyboard handling, etc.)
            registerPlainText(editor);
            // Register undo/redo history
            registerHistory(editor, createEmptyHistoryState(), 300);

            // Set initial content via Lexical's update API
            editor.update(() => {
                const root = $getRoot();
                // Only set content if editor is empty
                if (root.getTextContent().trim() === "") {
                    root.clear();
                    const paragraphs = [
                        "Dr. Tom Smith went to Washington, D.C. for the annual conference. He met with Prof. Johnson and Ms. Davis at the U.S. Capitol building.",
                        '"It was a productive meeting," he said. The next day, they reviewed the 3.5 billion dollar budget proposal.',
                        "Meanwhile, St. Patrick's Cathedral was hosting a special event nearby. About 2,500 people attended the ceremony.",
                    ];
                    for (const text of paragraphs) {
                        const p = $createParagraphNode();
                        p.append($createTextNode(text));
                        root.append(p);
                    }
                }
            });

            // ═══════════════════════════════════════════════════════════════
            // 2. COLOR PALETTE
            // ═══════════════════════════════════════════════════════════════
            const PALETTE = [
                {
                    bg: "rgba(99,102,241,0.18)",
                    border: "rgba(99,102,241,0.5)",
                    solid: "#6366f1",
                },
                {
                    bg: "rgba(244,63,94,0.18)",
                    border: "rgba(244,63,94,0.5)",
                    solid: "#f43f5e",
                },
                {
                    bg: "rgba(34,197,94,0.18)",
                    border: "rgba(34,197,94,0.5)",
                    solid: "#22c55e",
                },
                {
                    bg: "rgba(251,191,36,0.18)",
                    border: "rgba(251,191,36,0.5)",
                    solid: "#fbbf24",
                },
                {
                    bg: "rgba(14,165,233,0.18)",
                    border: "rgba(14,165,233,0.5)",
                    solid: "#0ea5e9",
                },
                {
                    bg: "rgba(168,85,247,0.18)",
                    border: "rgba(168,85,247,0.5)",
                    solid: "#a855f7",
                },
                {
                    bg: "rgba(249,115,22,0.18)",
                    border: "rgba(249,115,22,0.5)",
                    solid: "#f97316",
                },
                {
                    bg: "rgba(236,72,153,0.18)",
                    border: "rgba(236,72,153,0.5)",
                    solid: "#ec4899",
                },
                {
                    bg: "rgba(20,184,166,0.18)",
                    border: "rgba(20,184,166,0.5)",
                    solid: "#14b8a6",
                },
                {
                    bg: "rgba(132,204,22,0.18)",
                    border: "rgba(132,204,22,0.5)",
                    solid: "#84cc16",
                },
                {
                    bg: "rgba(217,70,239,0.18)",
                    border: "rgba(217,70,239,0.5)",
                    solid: "#d946ef",
                },
                {
                    bg: "rgba(251,146,60,0.18)",
                    border: "rgba(251,146,60,0.5)",
                    solid: "#fb923c",
                },
            ];

            // ═══════════════════════════════════════════════════════════════
            // 3. STATE
            // ═══════════════════════════════════════════════════════════════
            let nextId = 1;
            let nextColorIdx = 0;
            let sentences = []; // { id, text, colorIdx, start, end }
            let showHighlights = true;

            const hlLayer = document.getElementById("highlight-layer");
            const listEl = document.getElementById("sentence-list");
            const countEl = document.getElementById("s-count");
            const statusEl = document.getElementById("status");
            const langInput = document.getElementById("lang");
            const btnHL = document.getElementById("btn-highlights");
            const debugContent = document.getElementById("debug-content");
            const debugToggle = document.getElementById("debug-toggle");
            const debugArrow = document.getElementById("debug-arrow");

            // ═══════════════════════════════════════════════════════════════
            // 4. DOM TEXT MAPPING
            //    Walks the Lexical-rendered DOM to map plain-text offsets
            //    back to actual DOM text nodes (needed for Range/getClientRects)
            // ═══════════════════════════════════════════════════════════════
            function buildTextMap(root) {
                const segs = [];
                let offset = 0;
                const blockTags = new Set([
                    "DIV",
                    "P",
                    "BR",
                    "LI",
                    "H1",
                    "H2",
                    "H3",
                    "H4",
                    "H5",
                    "H6",
                    "BLOCKQUOTE",
                ]);

                function walk(node, isFirst) {
                    if (node.nodeType === Node.TEXT_NODE) {
                        if (node.length > 0) {
                            segs.push({
                                node,
                                textStart: offset,
                                len: node.length,
                            });
                            offset += node.length;
                        }
                    } else if (node.nodeType === Node.ELEMENT_NODE) {
                        const tag = node.tagName;
                        if (tag === "BR") {
                            offset += 1;
                            return;
                        }
                        if (blockTags.has(tag) && !isFirst && offset > 0)
                            offset += 1;
                        let first = true;
                        for (const child of node.childNodes) {
                            walk(child, first);
                            first = false;
                        }
                    }
                }

                let first = true;
                for (const child of root.childNodes) {
                    walk(child, first);
                    first = false;
                }

                // Reconstruct plain text to verify alignment
                let text = "";
                let cursor = 0;
                for (const s of segs) {
                    if (s.textStart > cursor)
                        text += "\n".repeat(s.textStart - cursor);
                    text += s.node.textContent;
                    cursor = s.textStart + s.len;
                }
                if (offset > cursor) text += "\n".repeat(offset - cursor);

                return { segs, text, totalLen: offset };
            }

            function textOffsetToDOM(segs, offset) {
                for (const s of segs) {
                    if (
                        offset >= s.textStart &&
                        offset <= s.textStart + s.len
                    ) {
                        return { node: s.node, offset: offset - s.textStart };
                    }
                }
                if (segs.length) {
                    const last = segs[segs.length - 1];
                    return { node: last.node, offset: last.len };
                }
                return null;
            }

            // ═══════════════════════════════════════════════════════════════
            // 5. SENTENCE SEGMENTATION (sentencex)
            //    Segments each Lexical paragraph independently so that
            //    Enter/newline always creates a sentence boundary.
            //    Returns [{text, start, end}, ...] with global character offsets.
            // ═══════════════════════════════════════════════════════════════
            function segmentText(fullText) {
                const lang = langInput.value || "en";
                const result = [];

                // Split on newlines (Lexical joins paragraphs with \n)
                // and segment each paragraph independently
                const lines = fullText.split("\n");
                let globalOffset = 0;

                for (let li = 0; li < lines.length; li++) {
                    const line = lines[li];

                    if (line.length > 0) {
                        const rawSentences = segment(lang, line);
                        let cursor = 0;

                        for (const sent of rawSentences) {
                            const idx = line.indexOf(sent, cursor);
                            if (idx === -1) continue;
                            result.push({
                                text: sent,
                                start: globalOffset + idx,
                                end: globalOffset + idx + sent.length,
                            });
                            cursor = idx + sent.length;
                        }
                    }

                    // +1 for the \n separator between paragraphs (except after last)
                    globalOffset +=
                        line.length + (li < lines.length - 1 ? 1 : 0);
                }

                return result;
            }

            // ═══════════════════════════════════════════════════════════════
            // 6. STABLE ID RECONCILIATION
            //    Matches new sentences to old ones to preserve IDs/colors.
            //    - Match forward from start (identical trimmed text)
            //    - Match backward from end
            //    - First unmatched inherits old ID (the "split" case)
            //    - Remaining get fresh IDs
            // ═══════════════════════════════════════════════════════════════
            function reconcile(oldList, newRaw) {
                if (!oldList.length) {
                    return newRaw.map((s) => ({
                        ...s,
                        id: nextId++,
                        colorIdx: nextColorIdx++ % PALETTE.length,
                    }));
                }

                const oldTexts = oldList.map((s) => s.text.trim());
                const newTexts = newRaw.map((s) => s.text.trim());

                // Forward match
                let fwd = 0;
                while (
                    fwd < oldTexts.length &&
                    fwd < newTexts.length &&
                    oldTexts[fwd] === newTexts[fwd]
                )
                    fwd++;

                // Backward match
                let bwd = 0;
                const maxBwd = Math.min(
                    oldTexts.length - fwd,
                    newTexts.length - fwd,
                );
                while (
                    bwd < maxBwd &&
                    oldTexts[oldTexts.length - 1 - bwd] ===
                        newTexts[newTexts.length - 1 - bwd]
                )
                    bwd++;

                const result = [];
                const unmatchedOldStart = fwd;
                const unmatchedOldEnd = oldList.length - bwd;

                for (let i = 0; i < newRaw.length; i++) {
                    if (i < fwd) {
                        result.push({
                            ...newRaw[i],
                            id: oldList[i].id,
                            colorIdx: oldList[i].colorIdx,
                        });
                    } else if (i >= newRaw.length - bwd) {
                        const oldIdx = oldList.length - (newRaw.length - i);
                        result.push({
                            ...newRaw[i],
                            id: oldList[oldIdx].id,
                            colorIdx: oldList[oldIdx].colorIdx,
                        });
                    } else if (
                        i === fwd &&
                        unmatchedOldStart < unmatchedOldEnd
                    ) {
                        // Split case: first fragment keeps the original sentence's identity
                        result.push({
                            ...newRaw[i],
                            id: oldList[unmatchedOldStart].id,
                            colorIdx: oldList[unmatchedOldStart].colorIdx,
                        });
                    } else {
                        result.push({
                            ...newRaw[i],
                            id: nextId++,
                            colorIdx: nextColorIdx++ % PALETTE.length,
                        });
                    }
                }

                return result;
            }

            // ═══════════════════════════════════════════════════════════════
            // 7. OVERLAY HIGHLIGHT RENDERING
            //    Uses Range.getClientRects() — zero DOM mutation to Lexical's tree
            // ═══════════════════════════════════════════════════════════════
            function renderHighlights() {
                hlLayer.innerHTML = "";
                if (!showHighlights) return;

                const { segs } = buildTextMap(editorEl);
                if (!segs.length) return;
                const wrapRect = editorEl.getBoundingClientRect();

                for (const s of sentences) {
                    const startPos = textOffsetToDOM(segs, s.start);
                    const endPos = textOffsetToDOM(
                        segs,
                        Math.max(s.start, s.end),
                    );
                    if (!startPos || !endPos) continue;

                    try {
                        const range = document.createRange();
                        range.setStart(
                            startPos.node,
                            Math.min(startPos.offset, startPos.node.length),
                        );
                        range.setEnd(
                            endPos.node,
                            Math.min(endPos.offset, endPos.node.length),
                        );
                        const rects = range.getClientRects();
                        const color = PALETTE[s.colorIdx % PALETTE.length];

                        for (const r of rects) {
                            if (r.width < 1) continue;
                            const div = document.createElement("div");
                            div.className = "hl-rect";
                            div.style.top = r.top - wrapRect.top + "px";
                            div.style.left = r.left - wrapRect.left + "px";
                            div.style.width = r.width + "px";
                            div.style.height = r.height + "px";
                            div.style.background = color.bg;
                            div.style.borderBottom =
                                "2px solid " + color.border;
                            div.style.borderRadius = "3px";
                            hlLayer.appendChild(div);
                        }
                    } catch (e) {
                        /* skip edge cases */
                    }
                }
            }

            // ═══════════════════════════════════════════════════════════════
            // 8. SENTENCE PANEL
            // ═══════════════════════════════════════════════════════════════
            function renderPanel() {
                countEl.textContent =
                    sentences.length +
                    " sentence" +
                    (sentences.length !== 1 ? "s" : "");
                listEl.innerHTML = "";
                for (const s of sentences) {
                    const color = PALETTE[s.colorIdx % PALETTE.length];
                    const row = document.createElement("div");
                    row.className = "s-row";
                    row.innerHTML = `
      <div class="s-color" style="background:${color.solid}"></div>
      <div class="s-id">#${String(s.id).padStart(3, "0")}</div>
      <div class="s-text">${esc(s.text)}</div>
      <div class="s-offsets">[${s.start}:${s.end}]</div>
    `;
                    row.addEventListener("mouseenter", () => focusSentence(s));
                    row.addEventListener("mouseleave", clearFocus);
                    listEl.appendChild(row);
                }
            }

            function focusSentence(target) {
                const allRects = hlLayer.querySelectorAll(".hl-rect");
                allRects.forEach((el) => (el.style.opacity = "0.12"));
                const { segs } = buildTextMap(editorEl);
                let rectIdx = 0;
                for (const s of sentences) {
                    const sp = textOffsetToDOM(segs, s.start);
                    const ep = textOffsetToDOM(segs, Math.max(s.start, s.end));
                    if (!sp || !ep) continue;
                    try {
                        const r = document.createRange();
                        r.setStart(
                            sp.node,
                            Math.min(sp.offset, sp.node.length),
                        );
                        r.setEnd(ep.node, Math.min(ep.offset, ep.node.length));
                        const n = [...r.getClientRects()].filter(
                            (x) => x.width >= 1,
                        ).length;
                        if (s.id === target.id) {
                            for (let j = rectIdx; j < rectIdx + n; j++) {
                                if (allRects[j])
                                    allRects[j].style.opacity = "1";
                            }
                        }
                        rectIdx += n;
                    } catch (e) {}
                }
            }

            function clearFocus() {
                hlLayer
                    .querySelectorAll(".hl-rect")
                    .forEach((el) => (el.style.opacity = "1"));
            }

            function esc(s) {
                return s
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }

            // ═══════════════════════════════════════════════════════════════
            // 9. LEXICAL UPDATE LISTENER (the "plugin")
            //    This is the Lexical-native way to react to every editor change.
            //    We read the EditorState, extract text, segment, reconcile, render.
            // ═══════════════════════════════════════════════════════════════
            editor.registerUpdateListener(({ editorState }) => {
                const t0 = performance.now();

                // Read text from Lexical's immutable EditorState
                let text = "";
                editorState.read(() => {
                    text = $getRoot().getTextContent();
                });

                // Update debug panel with serialized editor state
                try {
                    debugContent.textContent = JSON.stringify(
                        editorState.toJSON(),
                        null,
                        2,
                    );
                } catch (e) {}

                if (!text.trim()) {
                    sentences = [];
                    hlLayer.innerHTML = "";
                    renderPanel();
                    statusEl.textContent = "Empty";
                    return;
                }

                // Segment with sentencex
                const raw = segmentText(text);

                // Reconcile for stable IDs
                sentences = reconcile(sentences, raw);

                // Render
                renderHighlights();
                renderPanel();

                const dt = (performance.now() - t0).toFixed(1);
                statusEl.textContent = `${sentences.length} sentences · ${text.length} chars · ${dt}ms`;
            });

            // ═══════════════════════════════════════════════════════════════
            // 10. UI WIRING
            // ═══════════════════════════════════════════════════════════════

            // Toggle highlights (prep for invisible-marks mode with AI agent)
            btnHL.addEventListener("click", () => {
                showHighlights = !showHighlights;
                btnHL.textContent = showHighlights
                    ? "Highlights On"
                    : "Highlights Off";
                btnHL.classList.toggle("active", showHighlights);
                renderHighlights();
            });

            // Language change re-triggers segmentation
            langInput.addEventListener("change", () => {
                // Force a re-process by reading current state
                const state = editor.getEditorState();
                let text = "";
                state.read(() => {
                    text = $getRoot().getTextContent();
                });
                if (text.trim()) {
                    const raw = segmentText(text);
                    sentences = reconcile(sentences, raw);
                    renderHighlights();
                    renderPanel();
                }
            });

            // Debug panel toggle
            debugToggle.addEventListener("click", () => {
                debugContent.classList.toggle("open");
                debugArrow.textContent = debugContent.classList.contains("open")
                    ? "▾"
                    : "▸";
            });

            // Reposition highlights on resize
            window.addEventListener("resize", () => renderHighlights());

            statusEl.textContent = "Ready";
        </script>
    </body>
</html>
