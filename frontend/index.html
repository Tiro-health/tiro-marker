<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tiro-Marker - FHIR Questionnaire Assistant</title>
        <link rel="stylesheet" href="styles.css" />

        <!-- Import maps for ES modules -->
        <!-- Using esm.sh bundle feature to ensure shared lexical core -->
        <script type="importmap">
            {
                "imports": {
                    "lexical": "https://esm.sh/lexical@0.21.0",
                    "@lexical/rich-text": "https://esm.sh/@lexical/rich-text@0.21.0?deps=lexical@0.21.0",
                    "@lexical/history": "https://esm.sh/@lexical/history@0.21.0?deps=lexical@0.21.0",
                    "@lexical/html": "https://esm.sh/@lexical/html@0.21.0?deps=lexical@0.21.0",
                    "@lexical/mark": "https://esm.sh/@lexical/mark@0.21.0?deps=lexical@0.21.0",
                    "@lexical/selection": "https://esm.sh/@lexical/selection@0.21.0?deps=lexical@0.21.0",
                    "@lexical/utils": "https://esm.sh/@lexical/utils@0.21.0?deps=lexical@0.21.0",
                    "sentencex-wasm": "https://esm.sh/sentencex-wasm"
                }
            }
        </script>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Tiro-Marker</h1>
                <p class="subtitle">
                    AI-powered FHIR Questionnaire Filling Assistant
                </p>
            </header>

            <main class="split-layout">
                <!-- Left Panel: Clinical Notes Editor -->
                <section class="editor-section">
                    <h2>Clinical Notes</h2>
                    <p class="section-description">
                        Dictate or type clinical notes. The AI will extract structured data.
                    </p>

                    <!-- Agent Avatars -->
                    <div class="agents-bar">
                        <!-- Marker Agent -->
                        <div class="agent-avatar-container" id="marker-agent">
                            <div class="speech-bubble" id="marker-bubble">
                                <span class="bubble-spinner"></span>
                                <span class="bubble-text" id="marker-status">Watching</span>
                            </div>
                            <div class="avatar-circle" id="marker-avatar" title="Click to mark">
                                🖍️
                            </div>
                            <label class="mini-toggle">
                                <input type="checkbox" id="marker-live-toggle" checked>
                                <span class="mini-toggle-slider"></span>
                                <span class="mini-toggle-label">Live</span>
                            </label>
                        </div>

                        <!-- Populate Agent -->
                        <div class="agent-avatar-container" id="populate-agent">
                            <div class="speech-bubble" id="populate-bubble">
                                <span class="bubble-spinner"></span>
                                <span class="bubble-text" id="populate-status">Ready</span>
                            </div>
                            <div class="avatar-circle" id="populate-avatar" title="Click to fill">
                                📝
                            </div>
                            <label class="mini-toggle">
                                <input type="checkbox" id="populate-live-toggle">
                                <span class="mini-toggle-slider"></span>
                                <span class="mini-toggle-label">Live</span>
                            </label>
                        </div>
                    </div>

                    <div id="editor-container">
                        <!-- Lexical editor will be mounted here -->
                    </div>
                </section>

                <!-- Right Panel: FHIR Questionnaire -->
                <section class="form-section">
                    <h2>FHIR Questionnaire</h2>
                    <p class="section-description">
                        Form auto-populated from clinical notes.
                    </p>

                    <tiro-form-filler id="clinical-form">
                        <script type="application/fhir+json" slot="questionnaire">
                            {
                                "resourceType": "Questionnaire",
                                "url": "http://example.org/Questionnaire/clinical-intake",
                                "status": "draft",
                                "title": "Clinical Intake Form",
                                "item": [
                                    { "linkId": "q1", "type": "string", "text": "Chief complaint" },
                                    { "linkId": "q2", "type": "string", "text": "Pain severity" },
                                    { "linkId": "q3", "type": "string", "text": "Associated symptoms" },
                                    { "linkId": "q4", "type": "string", "text": "Vital signs" },
                                    { "linkId": "q5", "type": "string", "text": "Photosensitivity" },
                                    { "linkId": "q6", "type": "string", "text": "Family history" },
                                    { "linkId": "q7", "type": "string", "text": "Current medications" },
                                    { "linkId": "q8", "type": "string", "text": "Drug allergies" },
                                    { "linkId": "q9", "type": "string", "text": "Occupation" },
                                    { "linkId": "q10", "type": "string", "text": "Initial assessment" },
                                    { "linkId": "q11", "type": "string", "text": "Sleep patterns" },
                                    { "linkId": "q12", "type": "string", "text": "Caffeine intake" },
                                    { "linkId": "q13", "type": "string", "text": "Hydration status" },
                                    { "linkId": "q14", "type": "string", "text": "Recent stress" },
                                    { "linkId": "q15", "type": "string", "text": "Screen time" },
                                    { "linkId": "q16", "type": "string", "text": "Exercise habits" },
                                    { "linkId": "q17", "type": "string", "text": "Diet overview" },
                                    { "linkId": "q18", "type": "string", "text": "Previous episodes" },
                                    { "linkId": "q19", "type": "string", "text": "Treatment tried" },
                                    { "linkId": "q20", "type": "string", "text": "Treatment response" },
                                    { "linkId": "q21", "type": "string", "text": "Vision changes" },
                                    { "linkId": "q22", "type": "string", "text": "Neck stiffness" },
                                    { "linkId": "q23", "type": "string", "text": "Neurological signs" },
                                    { "linkId": "q24", "type": "string", "text": "Red flags" },
                                    { "linkId": "q25", "type": "string", "text": "Patient concerns" },
                                    { "linkId": "q26", "type": "string", "text": "Functional impact" },
                                    { "linkId": "q27", "type": "string", "text": "Work absence" },
                                    { "linkId": "q28", "type": "string", "text": "Treatment plan" },
                                    { "linkId": "q29", "type": "string", "text": "Follow-up timing" },
                                    { "linkId": "q30", "type": "string", "text": "Patient education" }
                                ]
                            }
                        </script>
                    </tiro-form-filler>

                    <div class="form-actions">
                        <button id="submit-form-btn" type="button">
                            Submit Form
                        </button>
                    </div>
                    <div id="form-response" class="form-response hidden"></div>
                </section>
            </main>

            <footer>
                <p>MedGemma Impact Challenge Project</p>
            </footer>
        </div>

        <!-- Load Tiro SDK -->
        <script src="https://cdn.tiro.health/sdk/next/tiro-web-sdk.iife.js"></script>

        <!-- Load application as ES module -->
        <script type="module" src="js/main.js"></script>
    </body>
</html>
