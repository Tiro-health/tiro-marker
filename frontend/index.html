<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tiro-Marker - FHIR Questionnaire Assistant</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="styles.css" />

        <!-- Import maps for ES modules -->
        <script type="importmap">
            {
                "imports": {
                    "lexical": "https://esm.sh/lexical@0.21.0",
                    "@lexical/rich-text": "https://esm.sh/@lexical/rich-text@0.21.0?deps=lexical@0.21.0",
                    "@lexical/history": "https://esm.sh/@lexical/history@0.21.0?deps=lexical@0.21.0",
                    "@lexical/html": "https://esm.sh/@lexical/html@0.21.0?deps=lexical@0.21.0",
                    "@lexical/mark": "https://esm.sh/@lexical/mark@0.21.0?deps=lexical@0.21.0",
                    "@lexical/selection": "https://esm.sh/@lexical/selection@0.21.0?deps=lexical@0.21.0",
                    "@lexical/utils": "https://esm.sh/@lexical/utils@0.21.0?deps=lexical@0.21.0",
                    "@lexical/list": "https://esm.sh/@lexical/list@0.21.0?deps=lexical@0.21.0",
                    "@lexical/offset": "https://esm.sh/@lexical/offset@0.21.0?deps=lexical@0.21.0",
                    "sentencex-wasm": "https://esm.sh/sentencex-wasm"
                }
            }
        </script>
    </head>
    <body>
        <div class="app-container">
            <!-- ===== Header ===== -->
            <header class="app-header">
                <div class="header-left">
                    <div class="header-logo">
                        <span class="logo-bold">TIRO</span><span class="logo-light">.marker</span>
                    </div>
                </div>
                <div class="header-center">
                    <span class="header-clock" id="header-clock">--:--:--</span>
                    <span class="header-date" id="header-date">---</span>
                </div>
                <div class="header-right">
                    <button class="btn btn-ghost" id="discard-btn">Discard</button>
                    <button class="btn btn-primary" id="complete-btn">Complete Assessment</button>
                </div>
            </header>

            <!-- ===== Main Content ===== -->
            <main class="split-layout">
                <!-- Left Panel: Clinical Notes Editor -->
                <section class="panel" id="editor-panel">
                    <div class="panel-header">
                        <div class="panel-header-left">
                            <!-- FileText icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                            <span class="panel-title">Clinical Notes</span>
                        </div>
                        <div class="panel-header-right">
                            <!-- Marker Agent Control -->
                            <div class="agent-control" id="marker-agent">
                                <button class="agent-action-btn" id="marker-avatar" title="Click to mark">
                                    <svg class="agent-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
                                    <span class="agent-spinner"></span>
                                    <span class="agent-status-dot"></span>
                                    <span class="agent-action-label" id="marker-action-label">Marker</span>
                                </button>
                                <label class="live-toggle">
                                    <input type="checkbox" id="marker-live-toggle" checked />
                                    <span class="live-toggle-track"></span>
                                    <span class="live-toggle-text">Live</span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="panel-body" id="editor-container">
                        <!-- Lexical editor will be mounted here -->
                    </div>
                    <!-- Voice Input Bar -->
                    <div class="voice-bar">
                        <button class="mic-btn" id="mic-btn" title="Voice input">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                        </button>
                        <span class="voice-status">Tap to dictate clinical notes</span>
                    </div>
                </section>

                <!-- Divider -->
                <div class="split-divider"></div>

                <!-- Right Panel: FHIR Questionnaire -->
                <section class="panel" id="form-panel">
                    <div class="panel-header">
                        <div class="panel-header-left">
                            <!-- ClipboardList icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><circle cx="8" cy="11.5" r=".5" fill="currentColor"/><circle cx="8" cy="16.5" r=".5" fill="currentColor"/></svg>
                            <span class="panel-title">Assessment Form</span>
                            <span class="completion-pct" id="completion-pct"></span>
                        </div>
                        <div class="panel-header-right">
                            <!-- Populate Agent Control -->
                            <div class="agent-control" id="populate-agent">
                                <button class="agent-action-btn" id="populate-avatar" title="Click to populate">
                                    <svg class="agent-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
                                    <span class="agent-spinner"></span>
                                    <span class="agent-status-dot"></span>
                                    <span class="agent-action-label" id="populate-action-label">Populate</span>
                                </button>
                                <label class="live-toggle">
                                    <input type="checkbox" id="populate-live-toggle" />
                                    <span class="live-toggle-track"></span>
                                    <span class="live-toggle-text">Live</span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="panel-body">
                        <tiro-form-filler id="clinical-form">
                            <script
                                type="application/fhir+json"
                                slot="questionnaire"
                            >
                                {
                                    "resourceType": "Questionnaire",
                                    "url": "http://example.org/Questionnaire/emergency-assessment",
                                    "status": "draft",
                                    "title": "Emergency Assessment",
                                    "item": [
                                        {
                                            "linkId": "emergency-assessment",
                                            "type": "group",
                                            "text": "Emergency Assessment",
                                            "extension": [
                                                {
                                                    "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                    "valueCodeableConcept": {
                                                        "coding": [
                                                            {
                                                                "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                "code": "block"
                                                            }
                                                        ]
                                                    }
                                                }
                                            ],
                                            "item": [
                                                {
                                                    "linkId": "patient-name",
                                                    "type": "string",
                                                    "text": "Patient name"
                                                },
                                                {
                                                    "linkId": "admission-datetime",
                                                    "type": "dateTime",
                                                    "text": "Admission date and time"
                                                },
                                                {
                                                    "linkId": "patient-conscious",
                                                    "type": "coding",
                                                    "text": "Patient conscious on arrival",
                                                    "answerOption": [
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/yesno",
                                                                "code": "yes",
                                                                "display": "Yes"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/yesno",
                                                                "code": "no",
                                                                "display": "No"
                                                            }
                                                        }
                                                    ],
                                                    "extension": [
                                                        {
                                                            "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                            "valueCodeableConcept": {
                                                                "coding": [
                                                                    {
                                                                        "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                        "code": "chips"
                                                                    }
                                                                ]
                                                            }
                                                        }
                                                    ]
                                                },
                                                {
                                                    "linkId": "chief-complaint",
                                                    "type": "string",
                                                    "text": "Chief complaint"
                                                },
                                                {
                                                    "linkId": "symptom-onset-time",
                                                    "type": "time",
                                                    "text": "Time of symptom onset"
                                                },
                                                {
                                                    "linkId": "pain-present",
                                                    "type": "coding",
                                                    "text": "Pain present",
                                                    "answerOption": [
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/yesno",
                                                                "code": "yes",
                                                                "display": "Yes"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/yesno",
                                                                "code": "no",
                                                                "display": "No"
                                                            }
                                                        }
                                                    ],
                                                    "extension": [
                                                        {
                                                            "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                            "valueCodeableConcept": {
                                                                "coding": [
                                                                    {
                                                                        "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                        "code": "chips"
                                                                    }
                                                                ]
                                                            }
                                                        }
                                                    ]
                                                },
                                                {
                                                    "linkId": "pain-severity",
                                                    "type": "decimal",
                                                    "text": "Pain severity (0-10 scale)"
                                                },
                                                {
                                                    "linkId": "triage-level",
                                                    "type": "coding",
                                                    "text": "Triage level",
                                                    "answerOption": [
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/triage",
                                                                "code": "critical",
                                                                "display": "Critical"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/triage",
                                                                "code": "urgent",
                                                                "display": "Urgent"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/triage",
                                                                "code": "semi-urgent",
                                                                "display": "Semi-urgent"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/triage",
                                                                "code": "non-urgent",
                                                                "display": "Non-urgent"
                                                            }
                                                        }
                                                    ],
                                                    "extension": [
                                                        {
                                                            "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                            "valueCodeableConcept": {
                                                                "coding": [
                                                                    {
                                                                        "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                        "code": "chips"
                                                                    }
                                                                ]
                                                            }
                                                        }
                                                    ]
                                                },
                                                {
                                                    "linkId": "vital-signs-group",
                                                    "type": "group",
                                                    "text": "Vital Signs",
                                                    "repeats": false,
                                                    "item": [
                                                        {
                                                            "linkId": "temperature",
                                                            "type": "decimal",
                                                            "text": "Temperature (Celsius)"
                                                        },
                                                        {
                                                            "linkId": "heart-rate",
                                                            "type": "decimal",
                                                            "text": "Heart rate (bpm)"
                                                        },
                                                        {
                                                            "linkId": "oxygen-saturation",
                                                            "type": "decimal",
                                                            "text": "Oxygen saturation (%)"
                                                        }
                                                    ]
                                                },
                                                {
                                                    "linkId": "medications",
                                                    "type": "coding",
                                                    "text": "Current medications",
                                                    "repeats": true,
                                                    "answerOption": [
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/medications",
                                                                "code": "aspirin",
                                                                "display": "Aspirin"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/medications",
                                                                "code": "metformin",
                                                                "display": "Metformin"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/medications",
                                                                "code": "lisinopril",
                                                                "display": "Lisinopril"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/medications",
                                                                "code": "atorvastatin",
                                                                "display": "Atorvastatin"
                                                            }
                                                        }
                                                    ],
                                                    "extension": [
                                                        {
                                                            "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                            "valueCodeableConcept": {
                                                                "coding": [
                                                                    {
                                                                        "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                        "code": "chips"
                                                                    }
                                                                ]
                                                            }
                                                        }
                                                    ],
                                                    "item": [
                                                        {
                                                            "linkId": "medication-dosage",
                                                            "type": "string",
                                                            "text": "Dosage"
                                                        },
                                                        {
                                                            "linkId": "medication-frequency",
                                                            "type": "string",
                                                            "text": "Frequency"
                                                        },
                                                        {
                                                            "linkId": "medication-route",
                                                            "type": "coding",
                                                            "text": "Route",
                                                            "answerOption": [
                                                                {
                                                                    "valueCoding": {
                                                                        "system": "http://example.org/cs/route",
                                                                        "code": "oral",
                                                                        "display": "Oral"
                                                                    }
                                                                },
                                                                {
                                                                    "valueCoding": {
                                                                        "system": "http://example.org/cs/route",
                                                                        "code": "iv",
                                                                        "display": "Intravenous"
                                                                    }
                                                                },
                                                                {
                                                                    "valueCoding": {
                                                                        "system": "http://example.org/cs/route",
                                                                        "code": "im",
                                                                        "display": "Intramuscular"
                                                                    }
                                                                }
                                                            ],
                                                            "extension": [
                                                                {
                                                                    "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                                    "valueCodeableConcept": {
                                                                        "coding": [
                                                                            {
                                                                                "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                                "code": "chips"
                                                                            }
                                                                        ]
                                                                    }
                                                                }
                                                            ]
                                                        }
                                                    ]
                                                },
                                                {
                                                    "linkId": "diagnosis",
                                                    "type": "coding",
                                                    "text": "Initial diagnosis",
                                                    "answerOption": [
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/diagnosis",
                                                                "code": "ami",
                                                                "display": "Acute myocardial infarction"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/diagnosis",
                                                                "code": "appendicitis",
                                                                "display": "Appendicitis"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/diagnosis",
                                                                "code": "fracture",
                                                                "display": "Fracture of bone"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/diagnosis",
                                                                "code": "stroke",
                                                                "display": "Stroke"
                                                            }
                                                        }
                                                    ],
                                                    "extension": [
                                                        {
                                                            "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                            "valueCodeableConcept": {
                                                                "coding": [
                                                                    {
                                                                        "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                        "code": "chips"
                                                                    }
                                                                ]
                                                            }
                                                        }
                                                    ]
                                                },
                                                {
                                                    "linkId": "last-meal-date",
                                                    "type": "date",
                                                    "text": "Date of last meal"
                                                },
                                                {
                                                    "linkId": "procedure-required",
                                                    "type": "coding",
                                                    "text": "Immediate procedure required",
                                                    "answerOption": [
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/yesno",
                                                                "code": "yes",
                                                                "display": "Yes"
                                                            }
                                                        },
                                                        {
                                                            "valueCoding": {
                                                                "system": "http://example.org/cs/yesno",
                                                                "code": "no",
                                                                "display": "No"
                                                            }
                                                        }
                                                    ],
                                                    "extension": [
                                                        {
                                                            "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                            "valueCodeableConcept": {
                                                                "coding": [
                                                                    {
                                                                        "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                        "code": "chips"
                                                                    }
                                                                ]
                                                            }
                                                        }
                                                    ]
                                                }
                                            ]
                                        }
                                    ]
                                }
                            </script>
                        </tiro-form-filler>
                    </div>
                    <!-- Hidden elements for JS compatibility -->
                    <button id="submit-form-btn" type="button" class="hidden"></button>
                    <div id="form-response" class="form-response hidden"></div>
                </section>
            </main>
        </div>

        <!-- Toast Container -->
        <div class="toast-container" id="toast-container"></div>

        <!-- Load Tiro SDK -->
        <script src="https://cdn.tiro.health/sdk/next/tiro-web-sdk.iife.js"></script>

        <!-- Load application as ES module -->
        <script type="module" src="js/main.js?v=9"></script>
    </body>
</html>
