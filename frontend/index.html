<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tiro-Marker - FHIR Questionnaire Assistant</title>
        <link rel="stylesheet" href="styles.css" />

        <!-- Import maps for ES modules -->
        <!-- Using esm.sh bundle feature to ensure shared lexical core -->
        <script type="importmap">
            {
                "imports": {
                    "lexical": "https://esm.sh/lexical@0.21.0",
                    "@lexical/rich-text": "https://esm.sh/@lexical/rich-text@0.21.0?deps=lexical@0.21.0",
                    "@lexical/history": "https://esm.sh/@lexical/history@0.21.0?deps=lexical@0.21.0",
                    "@lexical/html": "https://esm.sh/@lexical/html@0.21.0?deps=lexical@0.21.0",
                    "@lexical/mark": "https://esm.sh/@lexical/mark@0.21.0?deps=lexical@0.21.0",
                    "@lexical/selection": "https://esm.sh/@lexical/selection@0.21.0?deps=lexical@0.21.0",
                    "@lexical/utils": "https://esm.sh/@lexical/utils@0.21.0?deps=lexical@0.21.0",
                    "@lexical/list": "https://esm.sh/@lexical/list@0.21.0?deps=lexical@0.21.0",
                    "sentencex-wasm": "https://esm.sh/sentencex-wasm"
                }
            }
        </script>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Tiro-Marker</h1>
                <p class="subtitle">
                    AI-powered FHIR Questionnaire Filling Assistant
                </p>
            </header>

            <main class="split-layout">
                <!-- Left Panel: Clinical Notes Editor -->
                <section class="editor-section">
                    <h2>Clinical Notes</h2>
                    <p class="section-description">
                        Dictate or type clinical notes. The AI will extract
                        structured data.
                    </p>

                    <!-- Agent Avatars -->
                    <div class="agents-bar">
                        <!-- Marker Agent -->
                        <div class="agent-avatar-container" id="marker-agent">
                            <div class="speech-bubble" id="marker-bubble">
                                <span class="bubble-spinner"></span>
                                <span class="bubble-text" id="marker-status"
                                    >Watching</span
                                >
                            </div>
                            <div
                                class="avatar-circle"
                                id="marker-avatar"
                                title="Click to mark"
                            >
                                🖍️
                            </div>
                            <label class="mini-toggle">
                                <input
                                    type="checkbox"
                                    id="marker-live-toggle"
                                    checked
                                />
                                <span class="mini-toggle-slider"></span>
                                <span class="mini-toggle-label">Live</span>
                            </label>
                        </div>

                        <!-- Populate Agent -->
                        <div class="agent-avatar-container" id="populate-agent">
                            <div class="speech-bubble" id="populate-bubble">
                                <span class="bubble-spinner"></span>
                                <span class="bubble-text" id="populate-status"
                                    >Ready</span
                                >
                            </div>
                            <div
                                class="avatar-circle"
                                id="populate-avatar"
                                title="Click to fill"
                            >
                                📝
                            </div>
                            <label class="mini-toggle">
                                <input
                                    type="checkbox"
                                    id="populate-live-toggle"
                                />
                                <span class="mini-toggle-slider"></span>
                                <span class="mini-toggle-label">Live</span>
                            </label>
                        </div>
                    </div>

                    <div id="editor-container">
                        <!-- Lexical editor will be mounted here -->
                    </div>
                </section>

                <!-- Right Panel: FHIR Questionnaire -->
                <section class="form-section">
                    <h2>FHIR Questionnaire</h2>
                    <p class="section-description">
                        Form auto-populated from clinical notes.
                    </p>

                    <tiro-form-filler id="clinical-form">
                        <script
                            type="application/fhir+json"
                            slot="questionnaire"
                        >
                            {
                                "resourceType": "Questionnaire",
                                "url": "http://example.org/Questionnaire/emergency-assessment",
                                "status": "draft",
                                "title": "Emergency Assessment",
                                "item": [
                                    {
                                        "linkId": "emergency-assessment",
                                        "type": "group",
                                        "text": "Emergency Assessment",
                                        "extension": [
                                            {
                                                "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                "valueCodeableConcept": {
                                                    "coding": [
                                                        {
                                                            "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                            "code": "block"
                                                        }
                                                    ]
                                                }
                                            }
                                        ],
                                        "item": [
                                            {
                                                "linkId": "patient-name",
                                                "type": "string",
                                                "text": "Patient name"
                                            },
                                            {
                                                "linkId": "admission-datetime",
                                                "type": "dateTime",
                                                "text": "Admission date and time"
                                            },
                                            {
                                                "linkId": "patient-conscious",
                                                "type": "coding",
                                                "text": "Patient conscious on arrival",
                                                "answerOption": [
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/yesno",
                                                            "code": "yes",
                                                            "display": "Yes"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/yesno",
                                                            "code": "no",
                                                            "display": "No"
                                                        }
                                                    }
                                                ],
                                                "extension": [
                                                    {
                                                        "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                        "valueCodeableConcept": {
                                                            "coding": [
                                                                {
                                                                    "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                    "code": "chips"
                                                                }
                                                            ]
                                                        }
                                                    }
                                                ]
                                            },
                                            {
                                                "linkId": "chief-complaint",
                                                "type": "string",
                                                "text": "Chief complaint"
                                            },
                                            {
                                                "linkId": "symptom-onset-time",
                                                "type": "time",
                                                "text": "Time of symptom onset"
                                            },
                                            {
                                                "linkId": "pain-present",
                                                "type": "coding",
                                                "text": "Pain present",
                                                "answerOption": [
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/yesno",
                                                            "code": "yes",
                                                            "display": "Yes"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/yesno",
                                                            "code": "no",
                                                            "display": "No"
                                                        }
                                                    }
                                                ],
                                                "extension": [
                                                    {
                                                        "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                        "valueCodeableConcept": {
                                                            "coding": [
                                                                {
                                                                    "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                    "code": "chips"
                                                                }
                                                            ]
                                                        }
                                                    }
                                                ]
                                            },
                                            {
                                                "linkId": "pain-severity",
                                                "type": "decimal",
                                                "text": "Pain severity (0-10 scale)"
                                            },
                                            {
                                                "linkId": "triage-level",
                                                "type": "coding",
                                                "text": "Triage level",
                                                "answerOption": [
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/triage",
                                                            "code": "critical",
                                                            "display": "Critical"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/triage",
                                                            "code": "urgent",
                                                            "display": "Urgent"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/triage",
                                                            "code": "semi-urgent",
                                                            "display": "Semi-urgent"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/triage",
                                                            "code": "non-urgent",
                                                            "display": "Non-urgent"
                                                        }
                                                    }
                                                ],
                                                "extension": [
                                                    {
                                                        "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                        "valueCodeableConcept": {
                                                            "coding": [
                                                                {
                                                                    "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                    "code": "chips"
                                                                }
                                                            ]
                                                        }
                                                    }
                                                ]
                                            },
                                            {
                                                "linkId": "vital-signs-group",
                                                "type": "group",
                                                "text": "Vital Signs",
                                                "repeats": false,
                                                "item": [
                                                    {
                                                        "linkId": "temperature",
                                                        "type": "decimal",
                                                        "text": "Temperature (Celsius)"
                                                    },
                                                    {
                                                        "linkId": "heart-rate",
                                                        "type": "decimal",
                                                        "text": "Heart rate (bpm)"
                                                    },
                                                    {
                                                        "linkId": "oxygen-saturation",
                                                        "type": "decimal",
                                                        "text": "Oxygen saturation (%)"
                                                    }
                                                ]
                                            },
                                            {
                                                "linkId": "medications",
                                                "type": "coding",
                                                "text": "Current medications",
                                                "repeats": true,
                                                "answerOption": [
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/medications",
                                                            "code": "aspirin",
                                                            "display": "Aspirin"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/medications",
                                                            "code": "metformin",
                                                            "display": "Metformin"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/medications",
                                                            "code": "lisinopril",
                                                            "display": "Lisinopril"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/medications",
                                                            "code": "atorvastatin",
                                                            "display": "Atorvastatin"
                                                        }
                                                    }
                                                ],
                                                "extension": [
                                                    {
                                                        "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                        "valueCodeableConcept": {
                                                            "coding": [
                                                                {
                                                                    "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                    "code": "chips"
                                                                }
                                                            ]
                                                        }
                                                    }
                                                ],
                                                "item": [
                                                    {
                                                        "linkId": "medication-dosage",
                                                        "type": "string",
                                                        "text": "Dosage"
                                                    },
                                                    {
                                                        "linkId": "medication-frequency",
                                                        "type": "string",
                                                        "text": "Frequency"
                                                    },
                                                    {
                                                        "linkId": "medication-route",
                                                        "type": "coding",
                                                        "text": "Route",
                                                        "answerOption": [
                                                            {
                                                                "valueCoding": {
                                                                    "system": "http://example.org/cs/route",
                                                                    "code": "oral",
                                                                    "display": "Oral"
                                                                }
                                                            },
                                                            {
                                                                "valueCoding": {
                                                                    "system": "http://example.org/cs/route",
                                                                    "code": "iv",
                                                                    "display": "Intravenous"
                                                                }
                                                            },
                                                            {
                                                                "valueCoding": {
                                                                    "system": "http://example.org/cs/route",
                                                                    "code": "im",
                                                                    "display": "Intramuscular"
                                                                }
                                                            }
                                                        ],
                                                        "extension": [
                                                            {
                                                                "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                                "valueCodeableConcept": {
                                                                    "coding": [
                                                                        {
                                                                            "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                            "code": "chips"
                                                                        }
                                                                    ]
                                                                }
                                                            }
                                                        ]
                                                    }
                                                ]
                                            },
                                            {
                                                "linkId": "diagnosis",
                                                "type": "coding",
                                                "text": "Initial diagnosis",
                                                "answerOption": [
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/diagnosis",
                                                            "code": "ami",
                                                            "display": "Acute myocardial infarction"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/diagnosis",
                                                            "code": "appendicitis",
                                                            "display": "Appendicitis"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/diagnosis",
                                                            "code": "fracture",
                                                            "display": "Fracture of bone"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/diagnosis",
                                                            "code": "stroke",
                                                            "display": "Stroke"
                                                        }
                                                    }
                                                ],
                                                "extension": [
                                                    {
                                                        "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                        "valueCodeableConcept": {
                                                            "coding": [
                                                                {
                                                                    "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                    "code": "chips"
                                                                }
                                                            ]
                                                        }
                                                    }
                                                ]
                                            },
                                            {
                                                "linkId": "last-meal-date",
                                                "type": "date",
                                                "text": "Date of last meal"
                                            },
                                            {
                                                "linkId": "procedure-required",
                                                "type": "coding",
                                                "text": "Immediate procedure required",
                                                "answerOption": [
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/yesno",
                                                            "code": "yes",
                                                            "display": "Yes"
                                                        }
                                                    },
                                                    {
                                                        "valueCoding": {
                                                            "system": "http://example.org/cs/yesno",
                                                            "code": "no",
                                                            "display": "No"
                                                        }
                                                    }
                                                ],
                                                "extension": [
                                                    {
                                                        "url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl",
                                                        "valueCodeableConcept": {
                                                            "coding": [
                                                                {
                                                                    "system": "http://fhir.tiro.health/CodeSystem/tiro-questionnaire-item-control",
                                                                    "code": "chips"
                                                                }
                                                            ]
                                                        }
                                                    }
                                                ]
                                            }
                                        ]
                                    }
                                ]
                            }
                        </script>
                    </tiro-form-filler>

                    <div class="form-actions">
                        <button id="submit-form-btn" type="button">
                            Submit Form
                        </button>
                    </div>
                    <div id="form-response" class="form-response hidden"></div>
                </section>
            </main>

            <footer>
                <p>MedGemma Impact Challenge Project</p>
            </footer>
        </div>

        <!-- Load Tiro SDK -->
        <script src="https://cdn.tiro.health/sdk/next/tiro-web-sdk.iife.js"></script>

        <!-- Load application as ES module -->
        <script type="module" src="js/main.js"></script>
    </body>
</html>
