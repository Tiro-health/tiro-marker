name: "Chest pain case"
description: "Patient with acute chest pain and shortness of breath"

clinical_note: |
  <html>
    <body>
      <p>Patient presents with chest pain that started 2 hours ago.</p>
      <p>Pain is described as crushing, radiating to left arm.</p>
      <p>Associated symptoms: shortness of breath, sweating.</p>
      <p>No previous cardiac history.</p>
    </body>
  </html>

questionnaire:
  - linkId: chief-complaint
    type: string
  - linkId: onset
    type: integer
    unit: hours
  - linkId: pain-character
    type: coding
    repeats: false
    answerOptions:
      - sharp
      - dull
      - crushing
      - burning
  - linkId: radiation
    type: coding
    repeats: true
    answerOptions:
      - left arm
      - right arm
      - jaw
      - back
      - none
  - linkId: associated-symptoms
    type: coding
    repeats: true
    answerOptions:
      - shortness of breath
      - sweating
      - nausea
      - dizziness
  - linkId: previous-cardiac-history
    type: boolean
