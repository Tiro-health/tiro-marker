name:
  Presence check test - Coding question with single nested child, nested answer NOT present (tests mark_nested_children
  optimization)
description:
  Presence check test - Coding question with single nested child, nested answer NOT present (tests mark_nested_children
  optimization)
questionnaire:
  - linkId: smoking-status
    type: coding
    text: Smoking status
    answerOptions:
      - Current smoker
      - Former smoker
      - Never smoked
    item:
      - linkId: quit-date
        type: date
        text: Date quit smoking

expected_answers:
  # Smoking status IS present
  - fhirpath: "item.where(linkId='smoking-status').answer.valueCoding.display"
    match: exact
    expected: "Former smoker"

  # Quit date should NOT be present (not mentioned in the document)
  # smoking-status is coding (not group), so children are under answer.item
  - fhirpath: "item.where(linkId='smoking-status').answer.item.where(linkId='quit-date').answer.count()"
    match: exact
    expected: 0
