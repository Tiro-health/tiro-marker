name: "Nested pain assessment"
description: "Pain assessment with nested location and characteristics"

questionnaire:
  - linkId: pain-present
    type: boolean
    text: "Does the patient have pain?"
  - linkId: pain-details
    type: group
    text: "Pain Details"
    item:
      - linkId: pain-location
        type: coding
        text: "Location"
        answerOptions:
          - head
          - neck
          - upper back
          - lower back
          - chest
          - abdomen
      - linkId: pain-characteristics
        type: group
        text: "Pain Characteristics"
        item:
          - linkId: pain-duration
            type: integer
            text: "Duration"
            unit: days
          - linkId: pain-quality
            type: coding
            text: "Quality"
            answerOptions:
              - sharp
              - dull
              - aching
              - burning
              - throbbing
          - linkId: pain-severity
            type: integer
            text: "Severity"
            unit: "0-10"
      - linkId: pain-modifiers
        type: group
        text: "Modifying Factors"
        item:
          - linkId: worse-with
            type: coding
            text: "Worse with"
            repeats: true
            answerOptions:
              - movement
              - sitting
              - standing
              - coughing
          - linkId: better-with
            type: coding
            text: "Better with"
            repeats: true
            answerOptions:
              - rest
              - medication
              - heat
              - ice
  - linkId: neurological-symptoms
    type: coding
    text: "Associated neurological symptoms"
    repeats: true
    answerOptions:
      - radiation to legs
      - numbness
      - tingling
      - weakness

expected_answers:
  # Boolean - pain present (implied from "Patient reports lower back pain")
  - fhirpath: "item.where(linkId='pain-present').answer.valueBoolean"
    match: exact
    expected: true

  # Nested: pain-details > pain-location
  - fhirpath: "item.where(linkId='pain-details').item.where(linkId='pain-location').answer.valueCoding.display"
    match: exact
    expected: "lower back"

  # Nested: pain-details > pain-characteristics > pain-duration (1 week = 7 days)
  - fhirpath: "item.where(linkId='pain-details').item.where(linkId='pain-characteristics').item.where(linkId='pain-duration').answer.valueInteger"
    match: exact
    expected: 7

  # Nested: pain-details > pain-characteristics > pain-quality
  - fhirpath: "item.where(linkId='pain-details').item.where(linkId='pain-characteristics').item.where(linkId='pain-quality').answer.valueCoding.display"
    match: exact
    expected: "aching"

  # Nested: pain-details > pain-characteristics > pain-severity (6/10)
  - fhirpath: "item.where(linkId='pain-details').item.where(linkId='pain-characteristics').item.where(linkId='pain-severity').answer.valueInteger"
    match: exact
    expected: 6

  # Nested: pain-details > pain-modifiers > worse-with
  - fhirpath: "item.where(linkId='pain-details').item.where(linkId='pain-modifiers').item.where(linkId='worse-with').answer.valueCoding.display"
    match: set
    expected:
      - "movement"

  # Nested: pain-details > pain-modifiers > better-with
  - fhirpath: "item.where(linkId='pain-details').item.where(linkId='pain-modifiers').item.where(linkId='better-with').answer.valueCoding.display"
    match: set
    expected:
      - "rest"

  # Neurological symptoms - empty (no symptoms mentioned)
  - fhirpath: "item.where(linkId='neurological-symptoms').answer.valueCoding.display"
    match: set
    expected: []
