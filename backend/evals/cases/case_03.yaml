name: "Nested pain assessment"
description: "Pain assessment with nested location and characteristics"

questionnaire:
  - linkId: pain-present
    type: boolean
    text: "Does the patient have pain?"
  - linkId: pain-details
    type: group
    text: "Pain Details"
    item:
      - linkId: pain-location
        type: coding
        text: "Location"
        answerOptions:
          - head
          - neck
          - upper back
          - lower back
          - chest
          - abdomen
      - linkId: pain-characteristics
        type: group
        text: "Pain Characteristics"
        item:
          - linkId: pain-duration
            type: integer
            text: "Duration"
            unit: days
          - linkId: pain-quality
            type: coding
            text: "Quality"
            answerOptions:
              - sharp
              - dull
              - aching
              - burning
              - throbbing
          - linkId: pain-severity
            type: integer
            text: "Severity"
            unit: "0-10"
      - linkId: pain-modifiers
        type: group
        text: "Modifying Factors"
        item:
          - linkId: worse-with
            type: coding
            text: "Worse with"
            repeats: true
            answerOptions:
              - movement
              - sitting
              - standing
              - coughing
          - linkId: better-with
            type: coding
            text: "Better with"
            repeats: true
            answerOptions:
              - rest
              - medication
              - heat
              - ice
  - linkId: neurological-symptoms
    type: coding
    text: "Associated neurological symptoms"
    repeats: true
    answerOptions:
      - radiation to legs
      - numbness
      - tingling
      - weakness
      - none

expected_marks:
  - "pain-details"
  - "pain-details.pain-characteristics"
  - "pain-details.pain-modifiers"
  - "pain-present.answer"
  - "pain-details.pain-location.answer"
  - "pain-details.pain-characteristics.pain-duration.answer"
  - "pain-details.pain-characteristics.pain-severity.answer"
  - "pain-details.pain-modifiers.better-with.option-http://example.org/test|rest.answer"
  - "pain-details.pain-modifiers.worse-with.option-http://example.org/test|movement.answer"
  - "neurological-symptoms.option-http://example.org/test|none.answer"
