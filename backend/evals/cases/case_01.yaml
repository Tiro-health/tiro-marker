name: "Simple headache case"
description: "Patient with headache for 3 days"

questionnaire:
  - linkId: chief-complaint
    type: string
  - linkId: duration
    type: integer
    unit: days
  - linkId: severity
    type: coding
    repeats: false
    answerOptions:
      - mild
      - moderate
      - severe
  - linkId: symptoms
    type: coding
    repeats: true
    answerOptions:
      - nausea
      - vomiting
      - photophobia

expected_marks:
  - "chief-complaint.answer"
  - "duration.answer"
  - "severity.answer"
  - "symptoms.option-http://example.org/test|nausea.answer"
