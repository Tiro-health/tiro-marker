name: "Simple headache case"
description: "Patient with headache for 3 days"

questionnaire:
  - linkId: chief-complaint
    type: string
  - linkId: duration
    type: integer
    unit: days
  - linkId: severity
    type: coding
    repeats: false
    answerOptions:
      - mild
      - moderate
      - severe
  - linkId: symptoms
    type: coding
    repeats: true
    answerOptions:
      - nausea
      - vomiting
      - photophobia

expected_answers:
  # String - uses LLM judge for semantic similarity
  - fhirpath: "item.where(linkId='chief-complaint').answer.valueString"
    match: llm
    expected: "headache"

  # Integer - exact match
  - fhirpath: "item.where(linkId='duration').answer.valueInteger"
    match: exact
    expected: 3

  # Coding - check display (code may be null for free-text extraction)
  - fhirpath: "item.where(linkId='severity').answer.valueCoding.display"
    match: exact
    expected: "moderate"

  # Symptoms should be empty (patient denies nausea)
  - fhirpath: "item.where(linkId='symptoms').answer.count()"
    match: exact
    expected: 0
