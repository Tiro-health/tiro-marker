name: Question with nested items - Tests string question that has child items (severity, duration, treatment)
description: Question with nested items - Tests string question that has child items (severity, duration, treatment)
questionnaire:
  - linkId: visit-info
    type: group
    text: Visit Information
    repeats: false
    item:
      - linkId: primary-symptom
        type: string
        text: Primary symptom
        item:
          - linkId: severity
            type: string
            text: Severity
          - linkId: duration
            type: string
            text: Duration
          - linkId: treatment
            type: string
            text: Treatment given

expected_answers:
  # Nested: visit-info (group) > primary-symptom (string)
  - fhirpath: "item.where(linkId='visit-info').item.where(linkId='primary-symptom').answer.valueString"
    match: llm
    expected: "headache"

  # Nested: visit-info (group) > primary-symptom (string) > severity (via answer.item)
  - fhirpath: "item.where(linkId='visit-info').item.where(linkId='primary-symptom').answer.item.where(linkId='severity').answer.valueString"
    match: llm
    expected: "8 out of 10"

  # Nested: visit-info (group) > primary-symptom (string) > duration (via answer.item)
  - fhirpath: "item.where(linkId='visit-info').item.where(linkId='primary-symptom').answer.item.where(linkId='duration').answer.valueString"
    match: llm
    expected: "3 hours"

  # Nested: visit-info (group) > primary-symptom (string) > treatment (via answer.item)
  - fhirpath: "item.where(linkId='visit-info').item.where(linkId='primary-symptom').answer.item.where(linkId='treatment').answer.valueString"
    match: llm
    expected: "ibuprofen 400mg"
