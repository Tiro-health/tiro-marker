name: "Chest pain case"
description: "Patient with acute chest pain and shortness of breath"

questionnaire:
  - linkId: chief-complaint
    type: string
  - linkId: onset
    type: integer
    unit: hours
  - linkId: pain-character
    type: coding
    repeats: false
    answerOptions:
      - sharp
      - dull
      - crushing
      - burning
  - linkId: radiation
    type: coding
    repeats: true
    answerOptions:
      - left arm
      - right arm
      - jaw
      - back
      - none
  - linkId: associated-symptoms
    type: coding
    repeats: true
    answerOptions:
      - shortness of breath
      - sweating
      - nausea
      - dizziness
  - linkId: previous-cardiac-history
    type: boolean

expected_answers:
  # String - chief complaint
  - fhirpath: "item.where(linkId='chief-complaint').answer.valueString"
    match: llm
    expected: "chest pain"

  # Integer - onset in hours
  - fhirpath: "item.where(linkId='onset').answer.valueInteger"
    match: exact
    expected: 2

  # Coding - pain character
  - fhirpath: "item.where(linkId='pain-character').answer.valueCoding.display"
    match: exact
    expected: "crushing"

  # Coding repeats - radiation (only left arm mentioned)
  - fhirpath: "item.where(linkId='radiation').answer.valueCoding.display"
    match: set
    expected:
      - "left arm"

  # Coding repeats - associated symptoms (shortness of breath and sweating)
  - fhirpath: "item.where(linkId='associated-symptoms').answer.valueCoding.display"
    match: set
    expected:
      - "shortness of breath"
      - "sweating"

  # Boolean - no previous cardiac history
  - fhirpath: "item.where(linkId='previous-cardiac-history').answer.valueBoolean"
    match: exact
    expected: false
