name: "Chest pain case"
description: "Patient with acute chest pain and shortness of breath"

questionnaire:
  - linkId: chief-complaint
    type: string
  - linkId: onset
    type: integer
    unit: hours
  - linkId: pain-character
    type: coding
    repeats: false
    answerOptions:
      - sharp
      - dull
      - crushing
      - burning
  - linkId: radiation
    type: coding
    repeats: true
    answerOptions:
      - left arm
      - right arm
      - jaw
      - back
      - none
  - linkId: associated-symptoms
    type: coding
    repeats: true
    answerOptions:
      - shortness of breath
      - sweating
      - nausea
      - dizziness
  - linkId: previous-cardiac-history
    type: boolean

expected_marks:
  - "onset.answer"
  - "chief-complaint.answer"
  - "pain-character.answer"
  - "radiation.option-http://example.org/test|left arm.answer"
  - "associated-symptoms.option-http://example.org/test|shortness of breath.answer"
  - "associated-symptoms.option-http://example.org/test|sweating.answer"
  - "previous-cardiac-history.answer"
