name: Discharge summary with spread-out information - Tests concatenation of multiple marked spans for single questions
description: Discharge summary with spread-out information - Tests concatenation of multiple marked spans for single questions
questionnaire:
  - linkId: "1"
    type: string
    text: Chief Complaint
  - linkId: "2"
    type: date
    text: Admission Date
  - linkId: "3"
    type: string
    text: Primary Diagnosis
  - linkId: "4"
    type: decimal
    text: Systolic Blood Pressure at Discharge
  - linkId: "5"
    type: string
    text: Medication Name
  - linkId: "6"
    type: date
    text: Follow-up Appointment Date

expected_answers:
  # Chief Complaint
  - fhirpath: "item.where(linkId='1').answer.valueString"
    match: llm
    expected: "chest pain and difficulty breathing"

  # Admission Date
  - fhirpath: "item.where(linkId='2').answer.valueDate"
    match: exact
    expected: "2024-01-15"

  # Primary Diagnosis
  - fhirpath: "item.where(linkId='3').answer.valueString"
    match: llm
    expected: "Acute decompensated congestive heart failure"

  # Systolic Blood Pressure at Discharge
  - fhirpath: "item.where(linkId='4').answer.valueDecimal"
    match: exact
    expected: 128

  # Medication Name
  - fhirpath: "item.where(linkId='5').answer.valueString"
    match: llm
    expected: "Furosemide"

  # Follow-up Appointment Date
  - fhirpath: "item.where(linkId='6').answer.valueDate"
    match: exact
    expected: "2024-02-01"
