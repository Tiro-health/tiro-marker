name:
  Text with children including coding with nested item - Tests text question with decimal child and coding child that
  has nested string item
description:
  Text with children including coding with nested item - Tests text question with decimal child and coding child
  that has nested string item
questionnaire:
  - linkId: test
    type: group
    text: Test
    repeats: false
    item:
      - linkId: patient-information
        type: text
        text: Patient information
        item:
          - linkId: age
            type: decimal
            text: Age
          - linkId: country
            type: coding
            text: Country
            answerOptions:
              - Belgium
              - France
            item:
              - linkId: city
                type: string
                text: City

expected_answers:
  # Patient information (full sentence)
  - fhirpath: "item.where(linkId='test').item.where(linkId='patient-information').answer.valueString"
    match: llm
    expected: "De patient is 29 jaar oud en is van België, Gent"

  # Age (patient-information is text, not group → use answer.item)
  - fhirpath: "item.where(linkId='test').item.where(linkId='patient-information').answer.item.where(linkId='age').answer.valueDecimal"
    match: exact
    expected: 29

  # Country (patient-information is text, not group → use answer.item)
  - fhirpath: "item.where(linkId='test').item.where(linkId='patient-information').answer.item.where(linkId='country').answer.valueCoding.display"
    match: exact
    expected: "Belgium"

  # City (country is coding, not group → use answer.item)
  - fhirpath: "item.where(linkId='test').item.where(linkId='patient-information').answer.item.where(linkId='country').answer.item.where(linkId='city').answer.valueString"
    match: llm
    expected: "Gent"
