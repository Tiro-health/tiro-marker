name: "Multiple answer types test - Tests all answer types including the hardest case: repeating coding with nested children"
description:
  "Multiple answer types test - Tests all answer types including the hardest case: repeating coding with nested
  children"

questionnaire:
  - linkId: emergency-assessment
    type: group
    text: Emergency Assessment
    repeats: false
    item:
      - linkId: patient-name
        type: string
        text: Patient name
      - linkId: admission-datetime
        type: dateTime
        text: Admission date and time
      - linkId: patient-conscious
        type: coding
        text: Patient conscious on arrival
        answerOptions:
          - "Yes"
          - "No"
      - linkId: chief-complaint
        type: string
        text: Chief complaint
      - linkId: symptom-onset-time
        type: time
        text: Time of symptom onset
      - linkId: pain-present
        type: coding
        text: Pain present
        answerOptions:
          - "Yes"
          - "No"
      - linkId: pain-severity
        type: decimal
        text: Pain severity (0-10 scale)
      - linkId: triage-level
        type: coding
        text: Triage level
        answerOptions:
          - Critical
          - Urgent
          - Semi-urgent
          - Non-urgent
      - linkId: vital-signs-group
        type: group
        text: Vital Signs
        repeats: false
        item:
          - linkId: temperature
            type: decimal
            text: Temperature (Celsius)
          - linkId: heart-rate
            type: decimal
            text: Heart rate (bpm)
          - linkId: oxygen-saturation
            type: decimal
            text: Oxygen saturation (%)
      - linkId: medications
        type: coding
        text: Current medications
        repeats: true
        answerOptions:
          - Aspirin
          - Metformin
          - Lisinopril
          - Atorvastatin
        item:
          - linkId: medication-dosage
            type: string
            text: Dosage
          - linkId: medication-frequency
            type: string
            text: Frequency
          - linkId: medication-route
            type: coding
            text: Route
            answerOptions:
              - Oral
              - Intravenous
              - Intramuscular
      - linkId: diagnosis
        type: coding
        text: Initial diagnosis
        answerOptions:
          - Acute myocardial infarction
          - Appendicitis
          - Fracture of bone
          - Stroke
      - linkId: last-meal-date
        type: date
        text: Date of last meal
      - linkId: procedure-required
        type: coding
        text: Immediate procedure required
        answerOptions:
          - "Yes"
          - "No"

expected_answers:
  # String - patient name
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='patient-name').answer.valueString"
    match: llm
    expected: "Sarah Johnson"

  # DateTime - admission (FHIR format)
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='admission-datetime').answer.valueDateTime"
    match: llm
    expected: "2026-01-12T14:30:00"

  # Coding - patient conscious
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='patient-conscious').answer.valueCoding.display"
    match: exact
    expected: "Yes"

  # String - chief complaint
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='chief-complaint').answer.valueString"
    match: llm
    expected: "severe chest pain radiating to left arm"

  # Time - symptom onset
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='symptom-onset-time').answer.valueTime"
    match: llm
    expected: "12:45"

  # Coding - pain present
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='pain-present').answer.valueCoding.display"
    match: exact
    expected: "Yes"

  # Decimal - pain severity
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='pain-severity').answer.valueDecimal"
    match: exact
    expected: 7

  # Coding - triage level
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='triage-level').answer.valueCoding.display"
    match: exact
    expected: "Urgent"

  # Nested group: vital signs
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='vital-signs-group').item.where(linkId='temperature').answer.valueDecimal"
    match: exact
    expected: 37.8

  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='vital-signs-group').item.where(linkId='heart-rate').answer.valueDecimal"
    match: exact
    expected: 95

  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='vital-signs-group').item.where(linkId='oxygen-saturation').answer.valueDecimal"
    match: exact
    expected: 96

  # Medications - all 3 should be present, no extras
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='medications').answer.valueCoding.display"
    match: set
    expected:
      - "Aspirin"
      - "Metformin"
      - "Lisinopril"

  # Nested medication details - Aspirin (medications is coding → children under answer.item)
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='medications').answer.where(valueCoding.display='Aspirin').item.where(linkId='medication-dosage').answer.valueString"
    match: llm
    expected: "81 milligrams"

  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='medications').answer.where(valueCoding.display='Aspirin').item.where(linkId='medication-frequency').answer.valueString"
    match: llm
    expected: "Once daily in the morning"

  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='medications').answer.where(valueCoding.display='Aspirin').item.where(linkId='medication-route').answer.valueCoding.display"
    match: exact
    expected: "Oral"

  # Nested medication details - Metformin
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='medications').answer.where(valueCoding.display='Metformin').item.where(linkId='medication-dosage').answer.valueString"
    match: llm
    expected: "500 milligrams"

  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='medications').answer.where(valueCoding.display='Metformin').item.where(linkId='medication-frequency').answer.valueString"
    match: llm
    expected: "Twice daily with meals"

  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='medications').answer.where(valueCoding.display='Metformin').item.where(linkId='medication-route').answer.valueCoding.display"
    match: exact
    expected: "Oral"

  # Nested medication details - Lisinopril
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='medications').answer.where(valueCoding.display='Lisinopril').item.where(linkId='medication-dosage').answer.valueString"
    match: llm
    expected: "10 milligrams"

  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='medications').answer.where(valueCoding.display='Lisinopril').item.where(linkId='medication-frequency').answer.valueString"
    match: llm
    expected: "Once daily in the morning"

  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='medications').answer.where(valueCoding.display='Lisinopril').item.where(linkId='medication-route').answer.valueCoding.display"
    match: exact
    expected: "Oral"

  # Coding - diagnosis
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='diagnosis').answer.valueCoding.display"
    match: exact
    expected: "Acute myocardial infarction"

  # Date - last meal
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='last-meal-date').answer.valueDate"
    match: exact
    expected: "2026-01-12"

  # Coding - procedure required
  - fhirpath: "item.where(linkId='emergency-assessment').item.where(linkId='procedure-required').answer.valueCoding.display"
    match: exact
    expected: "Yes"
