name: Complex mixed structure - Tests nested groups with questions that have nested items at multiple levels
description: Complex mixed structure - Tests nested groups with questions that have nested items at multiple levels
questionnaire:
  - linkId: medical-assessment
    type: group
    text: Medical Assessment
    repeats: false
    item:
      - linkId: medical-history
        type: group
        text: Medical History
        repeats: false
        item:
          - linkId: patient-name
            type: group
            text: Patient name
            repeats: false
          - linkId: primary-condition
            type: group
            text: Primary condition
            repeats: false
            item:
              - linkId: onset-date
                type: string
                text: Onset date
              - linkId: current-status
                type: string
                text: Current status
      - linkId: current-visit
        type: group
        text: Current Visit
        repeats: false
        item:
          - linkId: chief-complaint
            type: group
            text: Chief complaint
            repeats: false
            item:
              - linkId: complaint-severity
                type: string
                text: Severity
              - linkId: complaint-location
                type: string
                text: Location
          - linkId: vital-signs
            type: group
            text: Vital Signs
            repeats: false
            item:
              - linkId: blood-pressure
                type: string
                text: Blood pressure
              - linkId: temperature
                type: string
                text: Temperature
          - linkId: medications
            type: group
            text: Current Medications
            repeats: false
            item:
              - linkId: medication-name
                type: group
                text: Medication
                repeats: false
                item:
                  - linkId: medication-dosage
                    type: string
                    text: Dosage
                  - linkId: medication-frequency
                    type: string
                    text: Frequency

expected_answers:
  # medical-assessment > medical-history > primary-condition > onset-date
  - fhirpath: "item.where(linkId='medical-assessment').item.where(linkId='medical-history').item.where(linkId='primary-condition').item.where(linkId='onset-date').answer.valueString"
    match: llm
    expected: "January 2020"

  # medical-assessment > medical-history > primary-condition > current-status
  - fhirpath: "item.where(linkId='medical-assessment').item.where(linkId='medical-history').item.where(linkId='primary-condition').item.where(linkId='current-status').answer.valueString"
    match: llm
    expected: "Well controlled"

  # medical-assessment > current-visit > chief-complaint > complaint-severity
  - fhirpath: "item.where(linkId='medical-assessment').item.where(linkId='current-visit').item.where(linkId='chief-complaint').item.where(linkId='complaint-severity').answer.valueString"
    match: llm
    expected: "moderate, 5 out of 10"

  # medical-assessment > current-visit > chief-complaint > complaint-location
  - fhirpath: "item.where(linkId='medical-assessment').item.where(linkId='current-visit').item.where(linkId='chief-complaint').item.where(linkId='complaint-location').answer.valueString"
    match: llm
    expected: "left side of chest with radiation to left arm"

  # medical-assessment > current-visit > vital-signs > blood-pressure
  - fhirpath: "item.where(linkId='medical-assessment').item.where(linkId='current-visit').item.where(linkId='vital-signs').item.where(linkId='blood-pressure').answer.valueString"
    match: llm
    expected: "135/88 mmHg"

  # medical-assessment > current-visit > vital-signs > temperature
  - fhirpath: "item.where(linkId='medical-assessment').item.where(linkId='current-visit').item.where(linkId='vital-signs').item.where(linkId='temperature').answer.valueString"
    match: llm
    expected: "37.2 degrees Celsius"

  # medical-assessment > current-visit > medications > medication-name > medication-dosage
  - fhirpath: "item.where(linkId='medical-assessment').item.where(linkId='current-visit').item.where(linkId='medications').item.where(linkId='medication-name').item.where(linkId='medication-dosage').answer.valueString"
    match: llm
    expected: "500mg"

  # medical-assessment > current-visit > medications > medication-name > medication-frequency
  - fhirpath: "item.where(linkId='medical-assessment').item.where(linkId='current-visit').item.where(linkId='medications').item.where(linkId='medication-name').item.where(linkId='medication-frequency').answer.valueString"
    match: llm
    expected: "Twice daily"
