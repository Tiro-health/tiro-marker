name:
  MRI knee report - Tests nested groups with coding options, decimal fields with units for measurements, and multiple
  anatomical locations
description:
  MRI knee report - Tests nested groups with coding options, decimal fields with units for measurements, and multiple
  anatomical locations
questionnaire:
  - linkId: bevindingen-beenmerg-gewricht-9
    type: group
    text: Bevindingen beenmerg/gewricht
    repeats: false
    item:
      - linkId: botstructuur
        type: string
        text: Botstructuur
        item:
          - linkId: botstructuur-pathologie
            type: coding
            text: Pathologie
            answerOptions:
              - Degeneratief
              - Botletsel
              - Normaal
            item:
              - linkId: botletsel-detail
                type: coding
                text: Botletsel detail
                answerOptions:
                  - Benigne
                  - Maligne
          - linkId: botstructuur-localisatie
            type: coding
            text: Localisatie
            answerOptions:
              - Mediale femurcondyl
              - Laterale femurcondyl
              - Mediaal tibiaplateau
              - Lateraal tibiaplateau
      - linkId: beenmergsignaal
        type: string
        text: Beenmergsignaal
        item:
          - linkId: beenmergsignaal-pathologie
            type: coding
            text: Pathologie
            answerOptions:
              - Oedeem
              - Infarct
              - Hematoom
              - Normaal
          - linkId: beenmergsignaal-localisatie
            type: coding
            text: Localisatie
            answerOptions:
              - Mediale femurcondyl
              - Laterale femurcondyl
              - Mediaal tibiaplateau
              - Lateraal tibiaplateau
          - linkId: beenmergsignaal-gradatie
            type: coding
            text: Gradatie
            answerOptions:
              - Beperkt
              - Matig
              - Uitgesproken
          - linkId: beenmergsignaal-afmeting
            type: coding
            text: Afmeting
            answerOptions:
              - XXX mm (L x B x H)
              - Niet besproken
            item:
              - linkId: afmeting-lbh
                type: group
                text: L x B x H
                item:
                  - linkId: afmeting-l
                    type: decimal
                    text: L
                    unit: mm
                  - linkId: afmeting-b
                    type: decimal
                    text: B
                    unit: mm
                  - linkId: afmeting-h
                    type: decimal
                    text: H
                    unit: mm
      - linkId: voorste-kruisband
        type: string
        text: Voorste kruisband
        item:
          - linkId: vkb-pathologie
            type: coding
            text: Voorste kruisband pathologie
            repeats: true
            answerOptions:
              - Partieel gescheurd
              - Volledige scheur
              - Normaal
            item:
              - linkId: vkb-scheur-locatie
                type: coding
                text: Scheur locatie
                answerOptions:
                  - Anteromediaal
                  - Posterolateraal
      - linkId: achterste-kruisband
        type: string
        text: Achterste kruisband
        item:
          - linkId: akb-pathologie
            type: coding
            text: Achterste kruisband pathologie
            answerOptions:
              - Partieel gescheurd
              - Volledige scheur
              - Normaal
      - linkId: intra-articulair-vocht
        type: string
        text: Intra-articulair vocht
        item:
          - linkId: vocht-status
            type: coding
            text: Status
            answerOptions:
              - Pathologie
              - Haemartrosis / Lipohaemartrosis
              - Normaal
            item:
              - linkId: vocht-gradatie
                type: coding
                text: Gradatie
                answerOptions:
                  - Beperkt
                  - Matig
                  - Uitgesproken
      - linkId: samenvatting
        type: string
        text: Samenvatting

expected_answers:
  # --- Botstructuur (string with nested children) ---
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='botstructuur').answer.valueString"
    match: llm
    expected: "Overwegend normaal, klein botletsel laterale femurcondyl"

  # botstructuur is string → children under answer.item
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='botstructuur').answer.item.where(linkId='botstructuur-pathologie').answer.valueCoding.display"
    match: exact
    expected: "Botletsel"

  # botstructuur-pathologie is coding → children under answer.item
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='botstructuur').answer.item.where(linkId='botstructuur-pathologie').answer.item.where(linkId='botletsel-detail').answer.valueCoding.display"
    match: exact
    expected: "Benigne"

  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='botstructuur').answer.item.where(linkId='botstructuur-localisatie').answer.valueCoding.display"
    match: exact
    expected: "Laterale femurcondyl"

  # --- Beenmergsignaal (string with nested children) ---
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='beenmergsignaal').answer.valueString"
    match: llm
    expected: "Oedeem in laterale femurcondyl en lateraal tibiaplateau, passend bij contusie"

  # beenmergsignaal is string → children under answer.item
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='beenmergsignaal').answer.item.where(linkId='beenmergsignaal-pathologie').answer.valueCoding.display"
    match: exact
    expected: "Oedeem"

  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='beenmergsignaal').answer.item.where(linkId='beenmergsignaal-localisatie').answer.valueCoding.display"
    match: exact
    expected: "Laterale femurcondyl"

  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='beenmergsignaal').answer.item.where(linkId='beenmergsignaal-gradatie').answer.valueCoding.display"
    match: exact
    expected: "Uitgesproken"

  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='beenmergsignaal').answer.item.where(linkId='beenmergsignaal-afmeting').answer.valueCoding.display"
    match: exact
    expected: "XXX mm (L x B x H)"

  # beenmergsignaal-afmeting is coding → afmeting-lbh under answer.item, afmeting-lbh is group
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='beenmergsignaal').answer.item.where(linkId='beenmergsignaal-afmeting').answer.item.where(linkId='afmeting-lbh').item.where(linkId='afmeting-l').answer.valueDecimal"
    match: exact
    expected: 22

  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='beenmergsignaal').answer.item.where(linkId='beenmergsignaal-afmeting').answer.item.where(linkId='afmeting-lbh').item.where(linkId='afmeting-b').answer.valueDecimal"
    match: exact
    expected: 15

  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='beenmergsignaal').answer.item.where(linkId='beenmergsignaal-afmeting').answer.item.where(linkId='afmeting-lbh').item.where(linkId='afmeting-h').answer.valueDecimal"
    match: exact
    expected: 18

  # --- Voorste kruisband (string with nested children) ---
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='voorste-kruisband').answer.valueString"
    match: llm
    expected: "Partieel gescheurd, scheur anteromediaal"

  # voorste-kruisband is string → children under answer.item
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='voorste-kruisband').answer.item.where(linkId='vkb-pathologie').answer.valueCoding.display"
    match: set
    expected: "Partieel gescheurd"

  # vkb-pathologie is coding → children under answer.item
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='voorste-kruisband').answer.item.where(linkId='vkb-pathologie').answer.where(valueCoding.display='Partieel gescheurd').item.where(linkId='vkb-scheur-locatie').answer.valueCoding.display"
    match: exact
    expected: "Anteromediaal"

  # --- Achterste kruisband (string with nested children) ---
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='achterste-kruisband').answer.valueString"
    match: llm
    expected: "Normaal"

  # achterste-kruisband is string → children under answer.item
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='achterste-kruisband').answer.item.where(linkId='akb-pathologie').answer.valueCoding.display"
    match: exact
    expected: "Normaal"

  # --- Intra-articulair vocht (string with nested children) ---
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='intra-articulair-vocht').answer.valueString"
    match: llm
    expected: "Matig intra-articulair vocht"

  # intra-articulair-vocht is string → children under answer.item
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='intra-articulair-vocht').answer.item.where(linkId='vocht-status').answer.valueCoding.display"
    match: exact
    expected: "Pathologie"

  # vocht-status is coding → children under answer.item
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='intra-articulair-vocht').answer.item.where(linkId='vocht-status').answer.item.where(linkId='vocht-gradatie').answer.valueCoding.display"
    match: exact
    expected: "Matig"

  # --- Samenvatting ---
  - fhirpath: "item.where(linkId='bevindingen-beenmerg-gewricht-9').item.where(linkId='samenvatting').answer.valueString"
    match: llm
    expected: "Partiële VKB scheur anteromediaal, beenmergoedeem lateraal passend bij contusie, benigne botletsel, vocht in het gewricht"
