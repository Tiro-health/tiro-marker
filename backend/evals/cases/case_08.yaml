name: Repeating group test - Tests repeating groups where the group itself repeats (e.g., multiple hospitalizations)
description: Repeating group test - Tests repeating groups where the group itself repeats (e.g., multiple hospitalizations)
questionnaire:
  - linkId: patient-history
    type: group
    text: Patient Medical History
    repeats: false
    item:
      - linkId: patient-name
        type: string
        text: Patient name
      - linkId: patient-dob
        type: date
        text: Date of birth
      - linkId: hospitalization
        type: group
        text: Previous Hospitalizations
        repeats: true
        item:
          - linkId: hospital-name
            type: string
            text: Hospital name
          - linkId: admission-date
            type: date
            text: Admission date
          - linkId: discharge-date
            type: date
            text: Discharge date
          - linkId: reason
            type: string
            text: Reason for admission
      - linkId: current-medications
        type: string
        text: Current medications

expected_answers:
  # Patient info
  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='patient-name').answer.valueString"
    match: llm
    expected: "Sarah Johnson"

  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='patient-dob').answer.valueDate"
    match: exact
    expected: "1985-03-15"

  # Count of hospitalizations
  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization').count()"
    match: exact
    expected: 3

  # First hospitalization - St. Mary's
  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[0].item.where(linkId='hospital-name').answer.valueString"
    match: llm
    expected: "St. Mary's Medical Center"

  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[0].item.where(linkId='admission-date').answer.valueDate"
    match: exact
    expected: "2022-05-10"

  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[0].item.where(linkId='discharge-date').answer.valueDate"
    match: exact
    expected: "2022-05-15"

  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[0].item.where(linkId='reason').answer.valueString"
    match: llm
    expected: "acute appendicitis"

  # Second hospitalization - City General
  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[1].item.where(linkId='hospital-name').answer.valueString"
    match: llm
    expected: "City General Hospital"

  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[1].item.where(linkId='admission-date').answer.valueDate"
    match: exact
    expected: "2023-08-22"

  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[1].item.where(linkId='discharge-date').answer.valueDate"
    match: exact
    expected: "2023-08-29"

  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[1].item.where(linkId='reason').answer.valueString"
    match: llm
    expected: "severe pneumonia"

  # Third hospitalization - Regional Medical
  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[2].item.where(linkId='hospital-name').answer.valueString"
    match: llm
    expected: "Regional Medical Center"

  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[2].item.where(linkId='admission-date').answer.valueDate"
    match: exact
    expected: "2024-11-03"

  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[2].item.where(linkId='discharge-date').answer.valueDate"
    match: exact
    expected: "2024-11-18"

  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='hospitalization')[2].item.where(linkId='reason').answer.valueString"
    match: llm
    expected: "fractured left femur"

  # Current medications
  - fhirpath: "item.where(linkId='patient-history').item.where(linkId='current-medications').answer.valueString"
    match: llm
    expected: "Lisinopril, Metformin"
