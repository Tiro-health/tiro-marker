name: Presence check test - Group with single child, answer NOT present (tests mark_context optimization)
description: Presence check test - Group with single child, answer NOT present (tests mark_context optimization)
questionnaire:
  - linkId: vital-signs
    type: group
    text: Vital Signs
    repeats: false
    item:
      - linkId: temperature
        type: decimal
        text: Body temperature

expected_answers:
  # Temperature should NOT be present (not mentioned in the document)
  - fhirpath: "item.where(linkId='vital-signs').item.where(linkId='temperature').answer.count()"
    match: exact
    expected: 0
