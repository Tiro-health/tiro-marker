name:
  Respiratory Oncology MDT Report - Tests complex nested groups, multiple coding types (chips, dropdown, combobox), decimal
  fields with units, text areas, enableWhen conditions, repeating groups, tables, and calculated fields
description:
  Respiratory Oncology MDT Report - Tests complex nested groups, multiple coding types (chips, dropdown, combobox),
  decimal fields with units, text areas, enableWhen conditions, repeating groups, tables, and calculated fields
questionnaire:
  - linkId: mdt-header
    type: group
    text: Verslag Multidisciplinair REO
    repeats: false
    item:
      - linkId: consult-datum
        type: date
        text: Consultdatum
      - linkId: moc-aanvrager
        type: coding
        text: MOC aanvrager
        answerOptions:
          - Dr. Janssen
          - Dr. Peeters
          - Dr. Vermeer
  - linkId: medische-voorgeschiedenis
    type: group
    text: Medische voorgeschiedenis
    repeats: false
    item:
      - linkId: voorgeschiedenis-tekst
        type: text
        text: Medische voorgeschiedenis
  - linkId: primaire-presentatie
    type: group
    text: REO primaire presentatie
    repeats: false
    item:
      - linkId: incidentiedatum
        type: date
        text: Incidentiedatum
      - linkId: diagnose
        type: coding
        text: Diagnose
        answerOptions:
          - NSCLC - adenocarcinoom
          - NSCLC - spinocellulair carcinoom
          - Kleincellig longcarcinoom (SCLC)
          - Mesothelioom - Epithelioïd
          - Mesothelioom - Sarcomatoïd
          - onbekend
      - linkId: tumorlokalisatie
        type: group
        text: Primaire tumorlokalisatie
        repeats: false
        item:
          - linkId: lokalisatie-links
            type: coding
            text: Links
            answerOptions:
              - linker onderkwab
              - linker bovenkwab
              - onbekend
          - linkId: lokalisatie-rechts
            type: coding
            text: Rechts
            answerOptions:
              - rechter onderkwab
              - rechter middenkwab
              - rechter bovenkwab
              - onbekend
          - linkId: lokalisatie-hoofdbronchus
            type: coding
            text: Hoofdbronchus
            answerOptions:
              - hoofdbronchus Li
              - hoofdbronchus Re
              - trachea
      - linkId: tnm-staging
        type: group
        text: TNM longkanker
        repeats: false
        item:
          - linkId: ct-stage
            type: coding
            text: T-stage
            answerOptions:
              - T1a
              - T1b
              - T1c
              - T2a
              - T2b
              - T3
              - T4
          - linkId: cn-stage
            type: coding
            text: N-stage
            answerOptions:
              - N0
              - N1
              - N2a
              - N2b
              - N3
          - linkId: cm-stage
            type: coding
            text: M-stage
            answerOptions:
              - M0
              - M1a
              - M1b
              - M1c1
              - M1c2
            item:
              - linkId: locatie-metastase
                type: coding
                text: Locatie van metastase
                repeats: true
                answerOptions:
                  - bot
                  - hersenen
                  - pleura
                  - bijnier
                  - lever
                  - long
          - linkId: stadium
            type: coding
            text: Stadium
            answerOptions:
              - IA1
              - IA2
              - IA3
              - IB
              - IIA
              - IIB
              - IIIA
              - IIIB
              - IIIC
              - IVA
              - IVB
      - linkId: mutaties
        type: coding
        text: Mutatie
        repeats: true
        answerOptions:
          - geen oncogene driver
          - EGFR
          - ALK
          - ROS1
          - KRAS
          - BRAF
          - RET
          - HER2
          - MET
        item:
          - linkId: egfr-subtypes
            type: coding
            text: EGFR subtypes
            repeats: true
            answerOptions:
              - ex18
              - ex19
              - ex20(ins)
              - ex21(L858R)
          - linkId: kras-subtypes
            type: coding
            text: KRAS subtypes
            repeats: true
            answerOptions:
              - G12A
              - G12C
              - G12D
              - G12V
      - linkId: ihc-profiel
        type: group
        text: IHC profiel
        repeats: false
        item:
          - linkId: pd-l1
            type: decimal
            text: PD-L1
            unit: "%"
          - linkId: ttf-1
            type: coding
            text: TTF-1
            answerOptions:
              - negatief
              - positief
              - niet uitgevoerd
          - linkId: p40
            type: coding
            text: P40
            answerOptions:
              - negatief
              - positief
              - niet uitgevoerd
      - linkId: who-score
        type: coding
        text: primaire WHO Score
        answerOptions:
          - WHO-score 0
          - WHO-score 1
          - WHO-score 2
          - WHO-score 3
          - WHO-score 4
      - linkId: rookstatus
        type: coding
        text: Rookstatus bij diagnose
        answerOptions:
          - ex-roker
          - niet-roker
          - roker
        item:
          - linkId: pakjaren
            type: decimal
            text: Pakjaar
            unit: pakjaar
      - linkId: nierfunctie
        type: decimal
        text: Nierfunctie eGFR
        unit: mL/min
      - linkId: longfunctie
        type: group
        text: Longfunctie
        repeats: false
        item:
          - linkId: longfunctie-status
            type: coding
            text: Longfunctie
            answerOptions:
              - niet uitgevoerd
          - linkId: fev1
            type: decimal
            text: FEV1
            unit: "%"
          - linkId: dlco
            type: decimal
            text: DLCO
            unit: "%"
      - linkId: charlson-index
        type: group
        text: Charlson Comorbidity Index
        repeats: false
        item:
          - linkId: cci-leeftijd
            type: coding
            text: Leeftijd
            answerOptions:
              - <50
              - 50–59
              - 60–69
              - 70–79
              - ≥80
          - linkId: cci-myocardinfarct
            type: coding
            text: Myocardinfarct
            answerOptions:
              - nee
              - ja
          - linkId: cci-hartfalen
            type: coding
            text: Congestief hartfalen
            answerOptions:
              - nee
              - ja
          - linkId: cci-vaatziekte
            type: coding
            text: Perifere vaatziekte
            answerOptions:
              - nee
              - ja
          - linkId: cci-cva-tia
            type: coding
            text: CVA of TIA
            answerOptions:
              - nee
              - ja
          - linkId: cci-dementie
            type: coding
            text: Dementie
            answerOptions:
              - nee
              - ja
          - linkId: cci-copd
            type: coding
            text: COPD
            answerOptions:
              - nee
              - ja
          - linkId: cci-diabetes
            type: coding
            text: Diabetes mellitus
            answerOptions:
              - geen/dieet gecontroleerd
              - ongecompliceerd
              - met eindorgaanschade
          - linkId: cci-solide-tumor
            type: coding
            text: Solide tumor
            answerOptions:
              - geen
              - gelokaliseerd
              - metastatisch
          - linkId: cci-score
            type: decimal
            text: CCI-score
      - linkId: extra-opmerkingen
        type: text
        text: Extra opmerkingen
  - linkId: behandeloverzicht
    type: group
    text: Behandeloverzicht
    repeats: false
    item:
      - linkId: behandeling-entry
        type: group
        text: Behandeloverzicht
        repeats: true
        item:
          - linkId: lijn
            type: coding
            text: Lijn
            answerOptions:
              - R0
              - 1L
              - 2L
              - 3L
              - 4L
          - linkId: periode-start
            type: date
            text: Periode start
          - linkId: periode-einde
            type: date
            text: Periode einde
          - linkId: behandeling-type
            type: coding
            text: Behandeling
            answerOptions:
              - Radiotherapie
              - Systeemtherapie
              - Chirurgie
            item:
              - linkId: omschrijving
                type: string
                text: Omschrijving
              - linkId: aantal-fracties
                type: decimal
                text: Number of fractions
              - linkId: radiatie-dosis
                type: decimal
                text: Delivered radiation dose
                unit: Gy
              - linkId: recist-bor
                type: coding
                text: RECIST BOR
                answerOptions:
                  - complete respons
                  - partiële respons
                  - stabiele ziekte
                  - progressieve ziekte
                  - NA
              - linkId: pt-stage
                type: coding
                text: pT-stage
                answerOptions:
                  - pTX
                  - pT0
                  - pT1a
                  - pT1b
                  - pT1c
                  - pT2a
                  - pT2b
                  - pT3
                  - pT4
              - linkId: pn-stage
                type: coding
                text: pN-stage
                answerOptions:
                  - pNX
                  - pN0
                  - pN1
                  - pN2a
                  - pN2b
                  - pN3
              - linkId: pr-stage
                type: coding
                text: pR-stage
                answerOptions:
                  - R0
                  - R1
                  - R2
  - linkId: actuele-problematiek
    type: group
    text: REO actuele problematiek
    repeats: false
    item:
      - linkId: beschrijving
        type: string
        text: Beschrijving
      - linkId: rtnm-classificatie
        type: group
        text: rTNM classificatie
        repeats: false
        item:
          - linkId: rt-stage
            type: coding
            text: rT-stage
            answerOptions:
              - TX
              - T0
              - T1a
              - T1b
              - T1c
              - T2a
              - T2b
              - T3
              - T4
          - linkId: rn-stage
            type: coding
            text: rN-stage
            answerOptions:
              - NX
              - N0
              - N1
              - N2a
              - N2b
              - N3
          - linkId: rm-stage
            type: coding
            text: rM-stage
            answerOptions:
              - MX
              - M0
              - M1
              - M1a
              - M1b
      - linkId: actuele-who-score
        type: coding
        text: Actuele WHO Score
        answerOptions:
          - WHO-score 0
          - WHO-score 1
          - WHO-score 2
          - WHO-score 3
          - WHO-score 4
      - linkId: leeftijd-categorie
        type: coding
        text: Leeftijd
        answerOptions:
          - jonger dan 75 jaar
          - 75 jaar of ouder
        item:
          - linkId: g8-screening
            type: group
            text: Geriatrische screening (G8)
            repeats: false
            item:
              - linkId: g8-voedselinname
                type: coding
                text: Voedselinname afgelopen 3 maanden
                answerOptions:
                  - ernstige afname
                  - matige afname
                  - geen afname
              - linkId: g8-gewichtsverlies
                type: coding
                text: Gewichtsverlies afgelopen 3 maanden
                answerOptions:
                  - ">3 kg"
                  - onbekend
                  - 1-3 kg
                  - geen gewichtsverlies
              - linkId: g8-mobiliteit
                type: coding
                text: Mobiliteit
                answerOptions:
                  - bed- of stoelgebonden
                  - komt uit bed/stoel maar gaat niet naar buiten
                  - gaat naar buiten
              - linkId: g8-neuropsycho
                type: coding
                text: Neuropsychologische aandoeningen
                answerOptions:
                  - ernstige dementie of depressie
                  - lichte dementie
                  - geen psychologische aandoeningen
              - linkId: g8-bmi
                type: coding
                text: BMI
                answerOptions:
                  - <19 kg/m²
                  - 19-21 kg/m²
                  - 21-23 kg/m²
                  - ≥23 kg/m²
              - linkId: g8-score
                type: decimal
                text: G8 score
      - linkId: gewichtsverlies-3m
        type: coding
        text: Gewichtsverlies laatste 3m
        answerOptions:
          - "> 5%"
          - < 5%
          - onbekend
  - linkId: besluit
    type: group
    text: REO besluit
    repeats: false
    item:
      - linkId: behandelplan
        type: text
        text: Behandelplan
      - linkId: therapie-intentie
        type: coding
        text: Primaire therapie intentie
        answerOptions:
          - Curatief/radicaal
          - Palliatief (inclusief SABR-oligometastasen)
          - Actieve follow-up
          - Onbekend
      - linkId: prognose
        type: text
        text: Prognose

expected_answers:
  # --- MDT Header (group) ---
  - fhirpath: "item.where(linkId='mdt-header').item.where(linkId='consult-datum').answer.valueDate"
    match: exact
    expected: "2026-01-15"

  - fhirpath: "item.where(linkId='mdt-header').item.where(linkId='moc-aanvrager').answer.valueCoding.display"
    match: exact
    expected: "Dr. Peeters"

  # --- Medische voorgeschiedenis (group) ---
  - fhirpath: "item.where(linkId='medische-voorgeschiedenis').item.where(linkId='voorgeschiedenis-tekst').answer.valueString"
    match: llm
    expected: "COPD Gold II since 2018, type 2 diabetes mellitus, myocardial infarction in 2019 with PCI stent, peripheral vascular disease, ex-smoker since 2020 with 45 pack-years"

  # --- Primaire presentatie (group) ---
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='incidentiedatum').answer.valueDate"
    match: exact
    expected: "2025-09-03"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='diagnose').answer.valueCoding.display"
    match: exact
    expected: "NSCLC - adenocarcinoom"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='who-score').answer.valueCoding.display"
    match: exact
    expected: "WHO-score 1"

  # Tumor lokalisatie (nested group)
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='tumorlokalisatie').item.where(linkId='lokalisatie-rechts').answer.valueCoding.display"
    match: exact
    expected: "rechter bovenkwab"

  # TNM staging (nested group)
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='tnm-staging').item.where(linkId='ct-stage').answer.valueCoding.display"
    match: exact
    expected: "T2a"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='tnm-staging').item.where(linkId='cn-stage').answer.valueCoding.display"
    match: exact
    expected: "N2b"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='tnm-staging').item.where(linkId='cm-stage').answer.valueCoding.display"
    match: exact
    expected: "M1c1"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='tnm-staging').item.where(linkId='stadium').answer.valueCoding.display"
    match: exact
    expected: "IVB"

  # Metastasis locations (cm-stage is coding → children under answer.item)
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='tnm-staging').item.where(linkId='cm-stage').answer.item.where(linkId='locatie-metastase').answer.valueCoding.display"
    match: set
    expected:
      - "bot"
      - "hersenen"
      - "lever"

  # Mutations (repeating coding) - only EGFR is positive, others are "negatief"
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='mutaties').answer.valueCoding.display"
    match: set
    expected:
      - "EGFR"

  # EGFR subtype (mutaties is coding → children under answer.item)
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='mutaties').answer.where(valueCoding.display='EGFR').item.where(linkId='egfr-subtypes').answer.valueCoding.display"
    match: set
    expected:
      - "ex19"

  # IHC profiel (nested group)
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='ihc-profiel').item.where(linkId='pd-l1').answer.valueDecimal"
    match: exact
    expected: 85

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='ihc-profiel').item.where(linkId='ttf-1').answer.valueCoding.display"
    match: exact
    expected: "positief"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='ihc-profiel').item.where(linkId='p40').answer.valueCoding.display"
    match: exact
    expected: "negatief"

  # Rookstatus (coding with nested child)
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='rookstatus').answer.valueCoding.display"
    match: exact
    expected: "ex-roker"

  # Pakjaren (rookstatus is coding → children under answer.item)
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='rookstatus').answer.item.where(linkId='pakjaren').answer.valueDecimal"
    match: exact
    expected: 45

  # Nierfunctie
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='nierfunctie').answer.valueDecimal"
    match: exact
    expected: 67

  # Longfunctie (nested group)
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='longfunctie').item.where(linkId='fev1').answer.valueDecimal"
    match: exact
    expected: 58

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='longfunctie').item.where(linkId='dlco').answer.valueDecimal"
    match: exact
    expected: 52

  # Charlson index (nested group)
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='charlson-index').item.where(linkId='cci-leeftijd').answer.valueCoding.display"
    match: exact
    expected: "70–79"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='charlson-index').item.where(linkId='cci-myocardinfarct').answer.valueCoding.display"
    match: exact
    expected: "ja"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='charlson-index').item.where(linkId='cci-vaatziekte').answer.valueCoding.display"
    match: exact
    expected: "ja"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='charlson-index').item.where(linkId='cci-dementie').answer.valueCoding.display"
    match: exact
    expected: "nee"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='charlson-index').item.where(linkId='cci-copd').answer.valueCoding.display"
    match: exact
    expected: "ja"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='charlson-index').item.where(linkId='cci-diabetes').answer.valueCoding.display"
    match: exact
    expected: "ongecompliceerd"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='charlson-index').item.where(linkId='cci-solide-tumor').answer.valueCoding.display"
    match: exact
    expected: "metastatisch"

  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='charlson-index').item.where(linkId='cci-score').answer.valueDecimal"
    match: exact
    expected: 8

  # Extra opmerkingen
  - fhirpath: "item.where(linkId='primaire-presentatie').item.where(linkId='extra-opmerkingen').answer.valueString"
    match: llm
    expected: "Family present at discussion, well informed. Next MOC planned in 6 weeks."

  # --- Actuele problematiek (group) ---
  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='beschrijving').answer.valueString"
    match: llm
    expected: "Progression under osimertinib with new brain metastases and increasing bone metastases"

  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='actuele-who-score').answer.valueCoding.display"
    match: exact
    expected: "WHO-score 2"

  # rTNM classification (nested group)
  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='rtnm-classificatie').item.where(linkId='rt-stage').answer.valueCoding.display"
    match: exact
    expected: "T2a"

  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='rtnm-classificatie').item.where(linkId='rn-stage').answer.valueCoding.display"
    match: exact
    expected: "N2b"

  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='rtnm-classificatie').item.where(linkId='rm-stage').answer.valueCoding.display"
    match: exact
    expected: "M1"

  # Leeftijd categorie (coding with nested group child)
  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='leeftijd-categorie').answer.valueCoding.display"
    match: exact
    expected: "75 jaar of ouder"

  # G8 screening (leeftijd-categorie is coding → g8-screening under answer.item, g8-screening is group)
  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='leeftijd-categorie').answer.item.where(linkId='g8-screening').item.where(linkId='g8-voedselinname').answer.valueCoding.display"
    match: exact
    expected: "matige afname"

  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='leeftijd-categorie').answer.item.where(linkId='g8-screening').item.where(linkId='g8-gewichtsverlies').answer.valueCoding.display"
    match: exact
    expected: "1-3 kg"

  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='leeftijd-categorie').answer.item.where(linkId='g8-screening').item.where(linkId='g8-mobiliteit').answer.valueCoding.display"
    match: exact
    expected: "gaat naar buiten"

  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='leeftijd-categorie').answer.item.where(linkId='g8-screening').item.where(linkId='g8-neuropsycho').answer.valueCoding.display"
    match: exact
    expected: "geen psychologische aandoeningen"

  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='leeftijd-categorie').answer.item.where(linkId='g8-screening').item.where(linkId='g8-bmi').answer.valueCoding.display"
    match: exact
    expected: "21-23 kg/m²"

  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='leeftijd-categorie').answer.item.where(linkId='g8-screening').item.where(linkId='g8-score').answer.valueDecimal"
    match: exact
    expected: 11

  - fhirpath: "item.where(linkId='actuele-problematiek').item.where(linkId='gewichtsverlies-3m').answer.valueCoding.display"
    match: exact
    expected: "> 5%"

  # --- Besluit (group) ---
  - fhirpath: "item.where(linkId='besluit').item.where(linkId='behandelplan').answer.valueString"
    match: llm
    expected: "Continue carboplatin/pemetrexed for 4 cycles with CT evaluation after 2 cycles. Palliative radiotherapy on symptomatic bone metastases. Geriatric consultation requested."

  - fhirpath: "item.where(linkId='besluit').item.where(linkId='therapie-intentie').answer.valueCoding.display"
    match: exact
    expected: "Palliatief (inclusief SABR-oligometastasen)"

  - fhirpath: "item.where(linkId='besluit').item.where(linkId='prognose').answer.valueString"
    match: llm
    expected: "Reserved prognosis, median survival 6-9 months for EGFR-positive NSCLC with brain metastases after first-line TKI progression"
